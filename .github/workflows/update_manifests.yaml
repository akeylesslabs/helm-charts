name: Update Manifests

on:
  workflow_dispatch:

jobs:
  update_manifests:
    runs-on: ubuntu-22.04
    name: Update All Generated Manifests
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - id: akeyless-ci
      uses: ./.github/actions/akeyless-ci-token
      with:
        app-id: ${{ secrets.AKEYLESS_CI_APP_ID }}
        app-private-key: ${{ secrets.AKEYLESS_CI_APP_PRIVATE_KEY }}
        repositories: helm-charts,akeyless-k8s-manifests

    - name: Checkout with akeyless-ci token
      uses: actions/checkout@v3
      with:
        token: ${{ steps.akeyless-ci.outputs.token }}

    - name: Checkout Manifests Repo
      uses: actions/checkout@v3
      with:
        repository: akeylesslabs/akeyless-k8s-manifests
        token: ${{ steps.akeyless-ci.outputs.token }}
        path: manifest_work_dir

      # The below step will pull in generated manifests from the last helm chart release and store them within the repo
    - name: Process Manifests (akeyless-secrets-injection)
      run: |
        .github/scripts/generate_manifests.sh

    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v4
      with:
        token: ${{ steps.akeyless-ci.outputs.token }}
        branch: ${{ env.branch_name }}
        commit-message: generated new manifest
        title: 'Auto Generate new manifest'
        body: >
          This PR is auto-generated for
          Generated New Manifest
        labels: Generate Manifest ,Auto PR

    - name: Merge PR
      env:
        GH_TOKEN: ${{ steps.akeyless-ci.outputs.token }}
      run: |
        gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --merge --delete-branch

    - name: After Checker
      run: tree -p ${GITHUB_WORKSPACE}/manifests

