suite: extraObjects contract
templates:
  - templates/extra-objects.yaml
release:
  name: rel
  namespace: extra-ns
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps literal numbers and booleans typed in a map entry
    set:
      extraObjects:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: typed
          spec:
            replicas: 3
            paused: true
            progressDeadlineSeconds: 1073741824
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.paused
          value: true
      - equal:
          path: spec.progressDeadlineSeconds
          value: 1073741824

  - it: renders a templated value in a map entry as a string
    set:
      extraObjects:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: typed
          spec:
            replicas: "{{ len .Release.Name }}"
    asserts:
      - equal:
          path: spec.replicas
          value: "3"

  - it: renders templated numbers and booleans typed from a string entry
    set:
      extraObjects:
        - |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ .Release.Name }}-typed"
          spec:
            replicas: {{ len .Release.Name }}
            paused: {{ eq .Release.Name "rel" }}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: rel-typed
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.paused
          value: true

  - it: renders a string entry without templates exactly as written
    set:
      extraObjects:
        - |
          apiVersion: example.com/v1
          kind: Probe
          metadata:
            name: exact
          spec:
            bigInt: 9007199254740993
            onString: "on"
            zeroPadded: "01234"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.bigInt
          value: 9007199254740993
      - equal:
          path: spec.onString
          value: "on"
      - equal:
          path: spec.zeroPadded
          value: "01234"

  - it: passes an escaped template expression through as literal text
    set:
      extraObjects:
        - apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: escaped
          spec:
            summary: 'instance {{ "{{" }} $labels.instance {{ "}}" }} is down'
    asserts:
      - equal:
          path: spec.summary
          value: "instance {{ $labels.instance }} is down"
