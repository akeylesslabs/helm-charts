replicaCount: 1

env:
  AKEYLESS_ACCESS_TYPE: api_key
  AKEYLESS_ACCESS_ID: p-12345678911123
  # Test-only base64-shaped placeholder; not a real credential.
  AKEYLESS_API_KEY: ZHVtbXktYXBpLWtleQ==

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    data:
      release: "{{ .Release.Name }}"
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    spec:
      provider: akeyless
      parameters:
        release: "{{ .Release.Name }}"
