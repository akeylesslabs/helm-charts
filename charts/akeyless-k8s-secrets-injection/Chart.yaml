apiVersion: v2
name: akeyless-secrets-injection
description: A Helm chart that deploys a mutating admission webhook that configures applications to request env vars from Akeyless Vault Secrets
maintainers:
  - name: Akeyless
    email: support@akeyless.io
    url: https://www.akeyless.io
type: application
# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
version: 2.6.0
# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application.
# 0.41.0+ required for AKEYLESS_ACCESS_TYPE=jwt / jwtProjectedToken (0.40.0 is CVE-only).
appVersion: 0.41.0
