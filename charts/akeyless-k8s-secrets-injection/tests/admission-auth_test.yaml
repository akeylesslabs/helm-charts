suite: akeyless-secrets-injection admission auth SEC-001
release:
  name: injector
  namespace: akeyless
tests:
  - it: "fails when networkPolicy enabled without allowedCIDRs"
    template: templates/networkpolicy.yaml
    set:
      # Escape SEC-001 on the Deployment so this assert hits networkpolicy.yaml.
      admissionAuth.allowUnauthenticated: true
      networkPolicy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy.allowedCIDRs is required"

  - it: "renders NetworkPolicy with fullname selector and allowedCIDRs"
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.allowedCIDRs:
        - 10.0.0.0/16
      metrics.enabled: true
      metrics.port: 8090
    asserts:
      - equal:
          path: spec.podSelector.matchLabels.app
          value: injector-akeyless-secrets-injection
      - equal:
          path: spec.podSelector.matchLabels.release
          value: injector
      - contains:
          path: spec.ingress[0].from
          content:
            ipBlock:
              cidr: 10.0.0.0/16
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8443
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8090

  - it: "sets ALLOW when allowUnauthenticated escape is used"
    template: templates/webhook-deployment.yaml
    set:
      admissionAuth.allowUnauthenticated: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ALLOW_UNAUTHENTICATED_ADMISSION
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ADMISSION_TOKEN_FILE

  - it: "stages ALLOW when admissionAuth enabled with require false"
    template: templates/webhook-deployment.yaml
    set:
      admissionAuth.enabled: true
      admissionAuth.require: false
      admissionAuth.existingSecret: my-admission
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ADMISSION_TOKEN_FILE
            value: /var/run/secrets/akeyless/admission-auth/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ALLOW_UNAUTHENTICATED_ADMISSION
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_REQUIRE_ADMISSION_AUTH

  - it: "enforces REQUIRE when admissionAuth enabled with require true"
    template: templates/webhook-deployment.yaml
    set:
      admissionAuth.enabled: true
      admissionAuth.require: true
      admissionAuth.existingSecret: my-admission
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ADMISSION_TOKEN_FILE
            value: /var/run/secrets/akeyless/admission-auth/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_REQUIRE_ADMISSION_AUTH
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ALLOW_UNAUTHENTICATED_ADMISSION

  - it: "sets ALLOW when networkPolicy has allowedCIDRs"
    template: templates/webhook-deployment.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.allowedCIDRs:
        - 10.0.0.0/16
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_ALLOW_UNAUTHENTICATED_ADMISSION
            value: "true"

  - it: "renders a bool env value as a quoted string"
    template: templates/webhook-deployment.yaml
    set:
      admissionAuth.allowUnauthenticated: true
      env.SOME_FLAG: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SOME_FLAG
            value: "true"
