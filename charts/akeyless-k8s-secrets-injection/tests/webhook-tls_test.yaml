suite: akeyless-secrets-injection webhook TLS
release:
  name: injector
  namespace: akeyless
tests:
  - it: "default path generates the Secret and a caBundle"
    template: templates/apiservice-webhook.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: items[0].kind
          value: Secret
      - equal:
          path: items[0].metadata.name
          value: injector-akeyless-secrets-injection
      - isNotEmpty:
          path: items[0].data["tls.crt"]
      - isNotEmpty:
          path: items[0].data["tls.key"]
      - isNotEmpty:
          path: items[0].data["ca.crt"]
      - equal:
          path: items[1].kind
          value: MutatingWebhookConfiguration
      - isNotEmpty:
          path: items[1].webhooks[0].clientConfig.caBundle

  - it: "default path mounts the chart's own Secret"
    template: templates/webhook-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: serving-cert
            secret:
              defaultMode: 420
              secretName: injector-akeyless-secrets-injection
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_SECRET_NAME
            value: injector-akeyless-secrets-injection

  - it: "caBundle without existingSecretName is rejected"
    set:
      webhook.tls.caBundle: |
        -----BEGIN CERTIFICATE-----
        TESTCA
        -----END CERTIFICATE-----
    asserts:
      - failedTemplate:
          errorPattern: "caBundle applies only when"

  - it: "existingSecretName with an explicit caBundle emits no Secret"
    template: templates/apiservice-webhook.yaml
    set:
      webhook.tls.existingSecretName: akeyless-injector-tls
      webhook.tls.caBundle: |
        -----BEGIN CERTIFICATE-----
        TESTCA
        -----END CERTIFICATE-----
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: items[0].kind
          value: MutatingWebhookConfiguration
      - equal:
          path: items[0].webhooks[0].clientConfig.caBundle
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tClRFU1RDQQotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
      - isNull:
          path: items[1]

  - it: "existingSecretName with caBundleAnnotations leaves caBundle to the injector"
    template: templates/apiservice-webhook.yaml
    set:
      webhook.tls.existingSecretName: akeyless-injector-tls
      webhook.tls.caBundleAnnotations:
        cert-manager.io/inject-ca-from: akeyless/akeyless-injector-tls
    asserts:
      - equal:
          path: items[0].kind
          value: MutatingWebhookConfiguration
      - equal:
          path: items[0].metadata.annotations["cert-manager.io/inject-ca-from"]
          value: akeyless/akeyless-injector-tls
      - isNull:
          path: items[0].webhooks[0].clientConfig.caBundle
      - isNull:
          path: items[1]

  - it: "existingSecretName mounts the user Secret and points the watch at it"
    template: templates/webhook-deployment.yaml
    set:
      webhook.tls.existingSecretName: akeyless-injector-tls
      webhook.tls.caBundle: |
        -----BEGIN CERTIFICATE-----
        TESTCA
        -----END CERTIFICATE-----
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: serving-cert
            secret:
              defaultMode: 420
              secretName: akeyless-injector-tls
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_SECRET_NAME
            value: akeyless-injector-tls

  - it: "existingSecretName with no CA source is rejected"
    set:
      webhook.tls.existingSecretName: akeyless-injector-tls
    asserts:
      - failedTemplate:
          errorPattern: "webhook.tls.caBundle"

  - it: "existingSecretName equal to the chart's own resource name is rejected"
    set:
      webhook.tls.existingSecretName: injector-akeyless-secrets-injection
      webhook.tls.caBundle: |
        -----BEGIN CERTIFICATE-----
        TESTCA
        -----END CERTIFICATE-----
    asserts:
      - failedTemplate:
          errorPattern: "must not be"

  - it: "caBundleAnnotations without existingSecretName is rejected"
    set:
      webhook.tls.caBundleAnnotations:
        cert-manager.io/inject-ca-from: akeyless/akeyless-injector-tls
    asserts:
      - failedTemplate:
          errorPattern: "caBundleAnnotations applies only when"

  - it: "caBundle and caBundleAnnotations together are rejected"
    set:
      webhook.tls.existingSecretName: akeyless-injector-tls
      webhook.tls.caBundle: |
        -----BEGIN CERTIFICATE-----
        TESTCA
        -----END CERTIFICATE-----
      webhook.tls.caBundleAnnotations:
        cert-manager.io/inject-ca-from: akeyless/akeyless-injector-tls
    asserts:
      - failedTemplate:
          errorPattern: "two writers for the same"

  - it: "a caBundle that is not a PEM certificate is rejected"
    set:
      webhook.tls.existingSecretName: akeyless-injector-tls
      webhook.tls.caBundle: bm90LWEtcGVt
    asserts:
      - failedTemplate:
          errorPattern: "does not contain a PEM certificate block"
