{{- $aa := .Values.admissionAuth | default dict }}
{{- if and $aa.enabled (not $aa.existingSecret) }}
{{- $secretName := printf "%s-admission-auth" (include "vault-secrets-webhook.fullname" .) }}
{{- $key := $aa.key | default "token" }}
{{- /* Prefer an existing token so helm upgrade / GitOps re-render does not rotate it. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := "" }}
{{- if and $existing $existing.data (index $existing.data $key) }}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "vault-secrets-webhook.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token | quote }}
{{- end }}
