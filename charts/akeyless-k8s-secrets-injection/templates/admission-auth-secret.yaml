{{- $aa := .Values.admissionAuth | default dict }}
{{- if and $aa.enabled (not $aa.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vault-secrets-webhook.fullname" . }}-admission-auth
  labels:
    app: {{ template "vault-secrets-webhook.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  {{ ($aa.key | default "token") }}: {{ randAlphaNum 48 | b64enc | quote }}
{{- end }}
