{{- $np := .Values.networkPolicy | default dict }}
{{- if $np.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vault-secrets-webhook.fullname" . }}
  labels:
    app: {{ template "vault-secrets-webhook.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: {{ template "vault-secrets-webhook.name" . }}
      release: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.internalPort }}
{{- if $np.allowedCIDRs }}
      from:
{{- range $np.allowedCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
{{- else if $np.denyPodCIDRs }}
      # Allow non-pod sources (typical API-server path); deny listed pod CIDRs.
      from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
{{- range $np.denyPodCIDRs }}
              - {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
