{{- $np := .Values.networkPolicy | default dict }}
{{- if $np.enabled }}
{{- if empty $np.allowedCIDRs }}
{{- fail "networkPolicy.allowedCIDRs is required when networkPolicy.enabled is true (explicit control-plane allowlist for SEC-001)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vault-secrets-webhook.fullname" . }}
  labels:
    {{- include "vault-secrets-webhook.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "vault-secrets-webhook.fullname" . | quote }}
      release: {{ .Release.Name | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
{{- range $np.allowedCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.internalPort }}
{{- if .Values.metrics.enabled }}
        - protocol: TCP
          port: {{ .Values.metrics.port }}
{{- end }}
{{- end }}
