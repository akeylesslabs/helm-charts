{{- $jwt := .Values.jwtProjectedToken | default dict }}
{{- $env := .Values.env | default dict }}
{{- $accType := index $env "AKEYLESS_ACCESS_TYPE" | default "" | toString | trim | lower }}
{{- $aud := "" }}
{{- $jwtVol := "akeyless-jwt" }}
{{- $jwtMount := "/var/run/secrets/akeyless/jwt" }}
{{- $jwtExp := 3600 }}
{{- if and (has $accType (list "jwt" "oauth2")) (not $jwt.enabled) }}
{{- fail "env.AKEYLESS_ACCESS_TYPE is jwt/oauth2 but jwtProjectedToken.enabled is false. Enable jwtProjectedToken and set its audience." }}
{{- end }}
{{- if $jwt.enabled }}
{{- $aud = $jwt.audience | default "" | toString | trim }}
{{- if not $aud }}
{{- fail "jwtProjectedToken.audience is required when jwtProjectedToken.enabled is true" }}
{{- end }}
{{- $jwtVol = $jwt.volumeName | default "akeyless-jwt" | toString | trim }}
{{- if or (not $jwtVol) (eq $jwtVol "serving-cert") }}
{{- fail "jwtProjectedToken.volumeName must be set and must not be serving-cert" }}
{{- end }}
{{- $jwtMount = $jwt.mountPath | default "/var/run/secrets/akeyless/jwt" | toString | trim | trimSuffix "/" }}
{{- if not $jwtMount }}
{{- fail "jwtProjectedToken.mountPath must not be empty when jwtProjectedToken.enabled is true" }}
{{- end }}
{{- $mpSlash := printf "%s/" $jwtMount }}
{{- $saSlash := "/var/run/secrets/kubernetes.io/serviceaccount/" }}
{{- if or (hasPrefix $mpSlash $saSlash) (hasPrefix $saSlash $mpSlash) }}
{{- fail "jwtProjectedToken.mountPath must not overlap the ServiceAccount token path" }}
{{- end }}
{{- $expStr := $jwt.expirationSeconds | default 3600 | toString | trim }}
{{- if not (regexMatch "^[0-9]+$" $expStr) }}
{{- fail "jwtProjectedToken.expirationSeconds must be an integer number of seconds" }}
{{- end }}
{{- $jwtExp = int $expStr }}
{{- if or (lt $jwtExp 600) (gt $jwtExp 4294967295) }}
{{- fail "jwtProjectedToken.expirationSeconds must be between 600 and 4294967295" }}
{{- end }}
{{- if hasKey $env "AKEYLESS_JWT_AUDIENCE" }}
{{- $envAud := index $env "AKEYLESS_JWT_AUDIENCE" | toString | trim }}
{{- if and $envAud (ne $envAud $aud) }}
{{- fail "env.AKEYLESS_JWT_AUDIENCE conflicts with jwtProjectedToken.audience; remove it from env or match the projected audience" }}
{{- end }}
{{- end }}
{{- if hasKey $env "AKEYLESS_JWT_FILE" }}
{{- $wantFile := printf "%s/token" $jwtMount }}
{{- $envFile := index $env "AKEYLESS_JWT_FILE" | toString | trim }}
{{- if and $envFile (ne $envFile $wantFile) }}
{{- fail "env.AKEYLESS_JWT_FILE conflicts with jwtProjectedToken.mountPath; remove it from env or match the projected token path" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: {{ include "deployment.type" $ }}
metadata:
  name: {{ template "vault-secrets-webhook.fullname" . }}
  labels:
    {{- include "vault-secrets-webhook.labels" . | nindent 4 }}
    {{- with omit (.Values.deployment.labels | default dict) "app" "release" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if and (eq (include "deployment.type" $) "Deployment") (not .Values.HPA.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ template "vault-secrets-webhook.fullname" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "vault-secrets-webhook.fullname" . }}
        release: {{ .Release.Name }}
        {{- with omit (.Values.deployment.labels | default dict) "app" "release" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/apiservice-webhook.yaml") . | sha256sum }}
        {{- if and .Values.metrics.enabled .Values.metrics.prometheus.enabled }}
        {{- toYaml .Values.metrics.prometheus.annotations | nindent 8 }}
        {{- end }}
    spec:
{{- if .Values.hostNetwork }} 
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
 {{- end }}
      serviceAccountName: {{ template "vault-secrets-webhook.serviceAccountName" . }}
      {{- include "vault-secrets-webhook.imagePullSecrets" . | indent 2 }}
      {{- if .Values.deployment.securityContext }}
      securityContext:
        {{- toYaml .Values.deployment.securityContext | nindent 12 }}
      {{- end }}
      volumes:
      - name: serving-cert
        secret:
          defaultMode: 420
          secretName: {{ include "vault-secrets-webhook.tlsSecretName" . }}
{{- if $jwt.enabled }}
      - name: {{ $jwtVol }}
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: {{ $jwtExp }}
              audience: {{ $aud | quote }}
{{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
          - name: TLS_CERT_FILE
            value: /var/serving-cert/tls.crt
          - name: TLS_PRIVATE_KEY_FILE
            value: /var/serving-cert/tls.key
          - name: TLS_SECRET_NAME
            value: {{ include "vault-secrets-webhook.tlsSecretName" . }}
          - name: TLS_SECRET_NAMESPACE
            value: {{ .Release.Namespace | quote }}
          - name: INTERNAL_PORT
            value: "{{ .Values.service.internalPort }}"
          - name: SERVICE_NAME
            value: "{{ printf "%s.%s.svc" (include "vault-secrets-webhook.fullname" .) .Release.Namespace }}"
          - name: DEBUG
            value: {{ .Values.debug | quote }}
          {{- if .Values.metrics.enabled }}
          - name: METRICS_PORT
            value: {{ .Values.metrics.port | quote }}
          {{- if .Values.metrics.prometheus.enabled }}
          - name: METRICS_ANNOTATIONS
            value: {{ toJson .Values.metrics.prometheus.annotations | quote }}
          {{- end }}
          {{- end }}
{{- if .Values.gatewayCert.tlsCertsSecretName }}
          - name: AKEYLESS_GW_CERTIFICATE
            valueFrom:
              secretKeyRef:
                name: {{.Values.gatewayCert.tlsCertsSecretName | quote  }}
                key: tls.crt
{{- end }}
{{- if .Values.restartRollout.enabled }}
          - name: RESTART_ROLLOUT
            value: enable
          - name: RESTART_INTERVAL
            value: {{ .Values.restartRollout.interval }}
{{- end }}
          - name: AKEYLESS_AGENT_IMAGE
            value: "{{ .Values.image.agentImage }}:{{ .Values.image.tag | default .Chart.AppVersion  }}"
{{- if $jwt.enabled }}
          - name: AKEYLESS_JWT_FILE
            value: {{ printf "%s/token" $jwtMount | quote }}
          - name: AKEYLESS_JWT_AUDIENCE
            value: {{ $aud | quote }}
{{- end }}
          {{- range $key, $value := $env }}
          {{- if and $jwt.enabled (or (eq $key "AKEYLESS_JWT_FILE") (eq $key "AKEYLESS_JWT_AUDIENCE")) }}
          {{- else }}
          - name: {{ $key }}
            value: {{ $value }}
          {{- end }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.internalPort }}
          {{- if .Values.metrics.enabled }}
            - containerPort: {{ .Values.metrics.port }}
              name: akls-metrics
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.internalPort }}
              scheme: HTTPS
{{- toYaml .Values.livenessProbe | trim | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.internalPort }}
              scheme: HTTPS
{{- toYaml .Values.readinessProbe | trim | nindent 12 }}
          volumeMounts:
          - mountPath: /var/serving-cert
            name: serving-cert
{{- if $jwt.enabled }}
          - name: {{ $jwtVol }}
            mountPath: {{ $jwtMount }}
            readOnly: true
{{- end }}
{{- if not .Values.openshiftEnabled }}
          securityContext: #//only for k8s - not openshift compatible
            runAsUser: 65534
            allowPrivilegeEscalation: false
{{- if .Values.containerSecurityContext }}
{{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{- if .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.deployment.nodeSelector | nindent 8 }}
    {{- end }}
    {{- if .Values.deployment.tolerations.enabled }}
      tolerations:
        {{- toYaml .Values.deployment.tolerations.data | nindent 8 }}
    {{- end }}
    {{- if .Values.deployment.affinity.enabled }}
      affinity:
      {{- toYaml .Values.deployment.affinity.data | nindent 8 }}
    {{- end }}
    {{- if .Values.deployment.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      {{- toYaml .Values.deployment.topologySpreadConstraints.data | nindent 8 }}
    {{- end }}
