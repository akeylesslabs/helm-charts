apiVersion: apps/v1
kind: {{ include "deployment.type" $ }}
metadata:
  name: {{ template "vault-secrets-webhook.fullname" . }}
  labels:
    {{- include "vault-secrets-webhook.labels" . | nindent 4 }}
    {{- if .Values.deployment.labels }}
      {{- toYaml .Values.deployment.labels | nindent 4 }}
    {{- end }}
spec:
  {{- if and (eq (include "deployment.type" $) "Deployment") (not .Values.HPA.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ template "vault-secrets-webhook.fullname" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "vault-secrets-webhook.fullname" . }}
        release: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/apiservice-webhook.yaml") . | sha256sum }}
        {{- if and .Values.metrics.enabled .Values.metrics.prometheus.enabled }}
        {{- toYaml .Values.metrics.prometheus.annotations | nindent 8 }}
        {{- end }}
    spec:
{{- if .Values.hostNetwork }} 
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
 {{- end }}
      serviceAccountName: {{ template "vault-secrets-webhook.serviceAccountName" . }}
      {{- include "vault-secrets-webhook.imagePullSecrets" . | indent 2 }}
      {{- if .Values.deployment.securityContext }}
      securityContext:
        {{- toYaml .Values.deployment.securityContext | nindent 12 }}
      {{- end }}
      volumes:
      - name: serving-cert
        secret:
          defaultMode: 420
          secretName: {{ include "vault-secrets-webhook.tlsSecretName" . }}
{{- if .Values.jwtProjectedToken.enabled }}
{{- if not .Values.jwtProjectedToken.audience }}
{{- fail "jwtProjectedToken.audience is required when jwtProjectedToken.enabled is true" }}
{{- end }}
      - name: {{ .Values.jwtProjectedToken.volumeName | default "akeyless-jwt" }}
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: {{ .Values.jwtProjectedToken.expirationSeconds | default 3600 }}
              audience: {{ .Values.jwtProjectedToken.audience | quote }}
{{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
          - name: TLS_CERT_FILE
            value: /var/serving-cert/tls.crt
          - name: TLS_PRIVATE_KEY_FILE
            value: /var/serving-cert/tls.key
          - name: TLS_SECRET_NAME
            value: {{ include "vault-secrets-webhook.tlsSecretName" . }}
          - name: TLS_SECRET_NAMESPACE
            value: {{ .Release.Namespace | quote }}
          - name: INTERNAL_PORT
            value: "{{ .Values.service.internalPort }}"
          - name: SERVICE_NAME
            value: "{{ printf "%s.%s.svc" (include "vault-secrets-webhook.fullname" .) .Release.Namespace }}"
          - name: DEBUG
            value: {{ .Values.debug | quote }}
          {{- if .Values.metrics.enabled }}
          - name: METRICS_PORT
            value: {{ .Values.metrics.port | quote }}
          {{- if .Values.metrics.prometheus.enabled }}
          - name: METRICS_ANNOTATIONS
            value: {{ toJson .Values.metrics.prometheus.annotations | quote }}
          {{- end }}
          {{- end }}
{{- if .Values.gatewayCert.tlsCertsSecretName }}
          - name: AKEYLESS_GW_CERTIFICATE
            valueFrom:
              secretKeyRef:
                name: {{.Values.gatewayCert.tlsCertsSecretName | quote  }}
                key: tls.crt
{{- end }}
{{- if .Values.restartRollout.enabled }}
          - name: RESTART_ROLLOUT
            value: enable
          - name: RESTART_INTERVAL
            value: {{ .Values.restartRollout.interval }}
{{- end }}
          - name: AKEYLESS_AGENT_IMAGE
            value: "{{ .Values.image.agentImage }}:{{ .Values.image.tag | default .Chart.AppVersion  }}"
{{- if .Values.jwtProjectedToken.enabled }}
          - name: AKEYLESS_JWT_FILE
            value: {{ printf "%s/token" (.Values.jwtProjectedToken.mountPath | default "/var/run/secrets/akeyless/jwt") | quote }}
          - name: AKEYLESS_JWT_AUDIENCE
            value: {{ .Values.jwtProjectedToken.audience | quote }}
{{- end }}
          {{- range $key, $value := .Values.env }}
          - name: {{ $key }}
            value: {{ $value }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.internalPort }}
          {{- if .Values.metrics.enabled }}
            - containerPort: {{ .Values.metrics.port }}
              name: akls-metrics
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.internalPort }}
              scheme: HTTPS
{{- toYaml .Values.livenessProbe | trim | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.internalPort }}
              scheme: HTTPS
{{- toYaml .Values.readinessProbe | trim | nindent 12 }}
          volumeMounts:
          - mountPath: /var/serving-cert
            name: serving-cert
{{- if .Values.jwtProjectedToken.enabled }}
          - name: {{ .Values.jwtProjectedToken.volumeName | default "akeyless-jwt" }}
            mountPath: {{ .Values.jwtProjectedToken.mountPath | default "/var/run/secrets/akeyless/jwt" }}
            readOnly: true
{{- end }}
{{- if not .Values.openshiftEnabled }}
          securityContext: #//only for k8s - not openshift compatible
            runAsUser: 65534
            allowPrivilegeEscalation: false
{{- if .Values.containerSecurityContext }}
{{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{- if .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.deployment.nodeSelector | nindent 8 }}
    {{- end }}
    {{- if .Values.deployment.tolerations.enabled }}
      tolerations:
        {{- toYaml .Values.deployment.tolerations.data | nindent 8 }}
    {{- end }}
    {{- if .Values.deployment.affinity.enabled }}
      affinity:
      {{- toYaml .Values.deployment.affinity.data | nindent 8 }}
    {{- end }}
    {{- if .Values.deployment.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      {{- toYaml .Values.deployment.topologySpreadConstraints.data | nindent 8 }}
    {{- end }}
