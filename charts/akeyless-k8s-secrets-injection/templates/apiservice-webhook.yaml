{{ $fullName := include "vault-secrets-webhook.fullname" . }}
{{ $mutatingWebhook := .Values.mutatingWebhook | default dict }}
{{ $tls := fromYaml (include "vault-secrets-webhook.tls" .) }}
{{ $existingSecret := include "vault-secrets-webhook.existingTLSSecretName" . }}
{{ $caBundle := $tls.caBundle | default "" }}
{{ $caBundleAnnotations := $tls.caBundleAnnotations | default dict }}
{{ $servingCert := dict }}
{{ $generatedCA := dict }}
{{ $certManager := fromYaml (include "vault-secrets-webhook.certManager" .) }}

{{- if and $certManager.enabled (not $caBundle) (not $caBundleAnnotations) }}
  {{- $caBundleAnnotations = dict "cert-manager.io/inject-ca-from" (printf "%s/%s" .Release.Namespace (include "vault-secrets-webhook.certificateName" .)) }}
{{- end }}

{{- if $existingSecret }}
  {{- if eq $existingSecret $fullName }}
    {{- fail (printf "mutatingWebhook.tls.existingSecretName must not be %q, the name the chart uses for its own generated Secret. The chart stops emitting that Secret when existingSecretName is set, so helm upgrade on an existing release deletes the Secret the webhook pods mount. Give the user-managed Secret a different name." $fullName) }}
  {{- end }}
  {{- if and (not $caBundle) (not $caBundleAnnotations) }}
    {{- fail "mutatingWebhook.tls.existingSecretName is set, so the chart no longer generates a CA and writes no caBundle. An empty caBundle makes the API server fall back to its own system trust roots, which is rarely what is intended here and fails at handshake time rather than at render time. Set mutatingWebhook.tls.caBundle to the PEM CA that signed the certificate, or mutatingWebhook.tls.caBundleAnnotations to let a controller such as cert-manager's ca-injector populate it." }}
  {{- end }}
{{- else }}
  {{- if $caBundleAnnotations }}
    {{- fail "mutatingWebhook.tls.caBundleAnnotations applies only when mutatingWebhook.tls.existingSecretName is set. The chart generates its own CA in this mode and writes the matching caBundle itself, so a CA injector acting on these annotations would replace it with an unrelated CA and the API server could no longer validate the webhook. Set existingSecretName, or remove the annotations." }}
  {{- end }}
  {{- $ca := genCA "webhook-ca" 3650 }}
  {{- $cn := printf "%s.%s.svc" $fullName .Release.Namespace }}
  {{- $servingCert = genSignedCert $cn nil (list $cn "") 365 $ca }}
  {{- $generatedCA = $ca }}
  {{- $caBundle = $ca.Cert }}
{{- end }}

apiVersion: v1
kind: List
metadata:
  name: {{ $fullName }}-webhook
items:

{{- if not $existingSecret }}

- apiVersion: v1
  kind: Secret
  metadata:
    name: {{ $fullName }}
    namespace: {{ .Release.Namespace }}
  data:
    tls.crt: {{ b64enc $servingCert.Cert }}
    tls.key: {{ b64enc $servingCert.Key }}
    ca.crt: {{ b64enc $generatedCA.Cert }}
{{- end }}

- apiVersion: admissionregistration.k8s.io/v1
  kind: MutatingWebhookConfiguration
  metadata:
    name: {{ $fullName }}
    {{- with $caBundleAnnotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  webhooks:
  - name: pods.{{ $fullName }}.admission
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $fullName }}
        path: /pods
      {{- if $caBundle }}
      caBundle: {{ b64enc $caBundle }}
      {{- end }}
    rules:
    - operations:
      - CREATE
      apiGroups:
      - "*"
      apiVersions:
      - "*"
      resources:
      - pods
    namespaceSelector:
      {{- $namespaceSelector := dig "namespaceSelector" dict $mutatingWebhook }}
      {{- tpl (toYaml $namespaceSelector) . | nindent 6 }}
    objectSelector:
      {{- $objectSelector := dig "objectSelector" dict $mutatingWebhook }}
      {{- tpl (toYaml $objectSelector) . | nindent 6 }}
    admissionReviewVersions: ["v1beta1"]
    sideEffects: None #Unknown
  {{- with dig "matchConditions" list $mutatingWebhook }}
    matchConditions:
      {{- tpl (toYaml .) $ | nindent 6 }}
  {{- end }}
{{- with omit $mutatingWebhook "name" "clientConfig" "rules" "namespaceSelector" "objectSelector" "matchConditions" "admissionReviewVersions" "sideEffects" "tls" }}
    {{- toYaml . | nindent 4 }}
{{- end }}
