# Default values for spot-config-webhook.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deployment:
  labels: {}
  # Remove the {} and add any needed values to your SecurityContext
  securityContext: {}
#    fsGroup: 3000
#    runAsUser: 65534

  # Scheduling configuration (mirrors akeyless-gateway pattern)
  nodeSelector:
  tolerations:
    enabled: false
    data: []
  affinity:
    enabled: false
    data:
  # Pod Topology Spread Constraints
  # ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
  topologySpreadConstraints:
    enabled: false
    data: []

replicaCount: 2
openshiftEnabled: false

# Additional MutatingWebhook fields to render on the webhook created by this chart.
# Useful for fields from admissionregistration.k8s.io/v1 MutatingWebhook such as failurePolicy,
# timeoutSeconds, namespaceSelector, objectSelector, matchPolicy, reinvocationPolicy, and matchConditions:
# https://kubernetes.io/docs/reference/kubernetes-api/admissionregistration/mutating-webhook-configuration-v1/#MutatingWebhook
#
# Configure failurePolicy to Fail so injected pod creation is blocked whenever the webhook is unreachable.
# See https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/#failure-policy
#
# The chart owns name, clientConfig, rules, admissionReviewVersions, and sideEffects to preserve
# existing behavior and avoid duplicate YAML keys.
# namespaceSelector, objectSelector, and matchConditions are rendered with tpl, so they can use
# release context such as {{ $.Release.Namespace }} and {{ $.Release.Name }}.
#
# The default namespaceSelector and objectSelector intentionally exclude this chart's release
# namespace and release-labeled objects. This prevents the injector from trying to mutate its own
# webhook pods/resources during install or upgrade, which can block the webhook from becoming ready
# and may cause pod creation failures. Override these selectors carefully.
#
# Examples:
# mutatingWebhook:
#   timeoutSeconds: 5
#   failurePolicy: Fail
#   namespaceSelector:
#     matchExpressions: [] # Matches all namespaces; make sure you still exclude the injector namespace if needed.
#   objectSelector:
#     matchExpressions: [] # Matches all objects; make sure you still exclude the injector release if needed.
#   matchPolicy: Equivalent
#   reinvocationPolicy: IfNeeded
#   matchConditions:
#     - name: skip-leases
#       expression: '!(request.resource.group == "coordination.k8s.io" && request.resource.resource == "leases")'
mutatingWebhook:
  failurePolicy: Ignore
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-node-lease
      - kube-system
      - "{{ $.Release.Namespace }}"
  objectSelector:
    matchExpressions:
    - key: release
      operator: NotIn
      values:
      - "{{ $.Release.Name }}"
  timeoutSeconds: 10
  matchConditions: []
debug: false

# Inbound TLS for the webhook server (the certificate the Kubernetes API server validates
# when it calls this webhook on service.internalPort).
#
# By default the chart generates a self-signed CA and serving certificate at render time.
# Because that generation is non-deterministic, every `helm template` / `helm upgrade`
# produces a new keypair. GitOps controllers such as ArgoCD render the chart on every sync,
# see the Secret and the MutatingWebhookConfiguration as drifted, and with self-heal enabled
# push the new values continuously. This causes `tls: bad certificate` handshake errors and
# rolls the webhook pods on every sync.
#
# Set `existingSecretName` to a user-managed Secret (for example one issued by cert-manager)
# to disable certificate generation entirely and make the rendered output deterministic.
# The webhook server watches that Secret and hot-reloads the certificate on rotation, so no
# pod restart is required when the certificate is renewed.
#
# When `existingSecretName` is set you must also tell the API server which CA to trust, via
# either `caBundle` or `caBundleAnnotations`. The chart fails rendering if neither is set.
#
# Example, cert-manager issuing the certificate and injecting the CA bundle:
# webhook:
#   tls:
#     existingSecretName: akeyless-injector-tls
#     caBundleAnnotations:
#       cert-manager.io/inject-ca-from: "akeyless/akeyless-injector-tls"
webhook:
  tls:
    # Name of an existing Secret in the release namespace containing `tls.crt` and `tls.key`.
    # When empty the chart generates and manages a self-signed certificate (default behavior).
    existingSecretName: ""
    # PEM-encoded CA certificate placed in the MutatingWebhookConfiguration `caBundle`.
    # Provide the raw PEM; the chart base64-encodes it. Only used with `existingSecretName`.
    caBundle: ""
    # Annotations added to the MutatingWebhookConfiguration, for controllers that inject the
    # `caBundle` themselves (for example cert-manager's ca-injector).
    # Only used with `existingSecretName`.
    caBundleAnnotations: {}

gatewayCert:
  #  Specifies an existing secret for gateway tls certificate must include:
  # - tls.crt (base64)
  tlsCertsSecretName:

# Remove the {} and add any needed values to your SecurityContext here, do not change runAsUser and allowPrivilegeEscalation
containerSecurityContext: {}
#  seccompProfile:
#    type: RuntimeDefault

image:
  repository: akeyless/k8s-webhook-server
  agentImage: akeyless/k8s-secrets-sidecar

  ## Alternative mirror registry
  # repository: docker.registry-2.akeyless.io/k8s-webhook-server
  # agentImage: docker.registry-2.akeyless.io/k8s-secrets-sidecar

  pullPolicy: IfNotPresent

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  # name: ""
  # Optional additional annotations to add to the controller's ServiceAccount
  # annotations: {}
  # Automount API credentials for a Service Account.
  automountServiceAccountToken: true
  labels: {}

restartRollout:
  enabled: false
  interval: 1m

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5

service:
  name: secrets-webhook
  type: ClusterIP
  externalPort: 443
  internalPort: 8443
  labels: {}

# for EKS using custom CNI
# hostNetwork: true

env:
  AKEYLESS_URL: "https://vault.akeyless.io"
  AKEYLESS_ACCESS_TYPE: ""  # azure_ad/aws_iam/api_key/k8s
  AKEYLESS_ACCESS_ID: ""

 # AKEYLESS_API_GW_URL: "https://api-gw-url"
 # AKEYLESS_POD_ACCESS_PATH: "<location-to-access-secrets-per-pod-name>"
 # AKEYLESS_NAMESPACE_ACCESS_PATH: "<location-to-access-secrets-per-namespace>"
 # AKEYLESS_SECRET_DIR_NAME: "<path>"
 # AKEYLESS_API_KEY: "<api_key>"
 # AKEYLESS_CRASH_POD_ON_ERROR: "enable"
 # AKEYLESS_K8S_AUTH_CONF_NAME: "K8s_conf_name"

 # the gw base64 certificate file e.g: 'cat my-gw.crt | base64'
 # AKEYLESS_GW_CERTIFICATE:


  AKEYLESS_AGENT_LIMITS_CPU: "500m"
  AKEYLESS_AGENT_REQUESTS_CPU: "250m"
  AKEYLESS_AGENT_LIMITS_MEM: "128Mi"
  AKEYLESS_AGENT_REQUESTS_MEM: "64Mi"


resources:
  limits:
    cpu: 0.5
    memory: 192Mi
  requests:
    cpu: 0.25
    memory: 128Mi


metrics:
  enabled: false
  port: 8090
  prometheus:
    enabled: true
    podMonitor: true
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "akls-metrics"


HPA:
  # Note that metrics server must be installed for this to work:
  # https://github.com/kubernetes-sigs/metrics-server
  enabled: false
  minReplicas: 1
  maxReplicas: 14
  cpuAvgUtil: 50
  memAvgUtil: 50

  annotations: {}

  ## Pod Disruption Budget configuration
  ## Note: PDB is only applicable to Deployments, not DaemonSets
  ##
pdb:
  ## Set to true to enable Pod Disruption Budget
  enabled: false
  ## Labels to add to webhook service pdb
  labels: {}
  ## Annotations to add to the webhook service pdb
  annotations: {}
  ## Number of pods that are available after eviction as number or percentage (eg.: 50%)
  # @default -- `""` (defaults to 1 if not specified)
  minAvailable: ""
  ## Number of pods that are unavailable after eviction as number or percentage (eg.: 50%).
  ## Has higher precedence over `pdb.minAvailable`
  maxUnavailable: ""
