suite: gateway token request rbac
templates:
  - templates/token-request-rbac.yaml
release:
  name: gw
  namespace: akeyless
tests:
  - it: renders nothing on the default service account
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the service account is named default
    set:
      globalConfig.serviceAccount.serviceAccountName: default
    asserts:
      - hasDocuments:
          count: 0

  - it: lets a created service account request tokens for itself only
    set:
      globalConfig.serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Role
      - documentIndex: 0
        equal:
          path: metadata.name
          value: gw-akeyless-gateway-token-request
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: akeyless
      - documentIndex: 0
        equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["serviceaccounts/token"]
              resourceNames: ["gw-akeyless-gateway"]
              verbs: ["create"]
      - documentIndex: 1
        isKind:
          of: RoleBinding
      - documentIndex: 1
        equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: gw-akeyless-gateway
              namespace: akeyless
      - documentIndex: 1
        equal:
          path: roleRef.name
          value: gw-akeyless-gateway-token-request

  - it: uses an existing named service account
    set:
      globalConfig.serviceAccount.serviceAccountName: my-gw-sa
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: rules[0].resourceNames
          value: ["my-gw-sa"]
      - documentIndex: 1
        equal:
          path: subjects[0].name
          value: my-gw-sa
