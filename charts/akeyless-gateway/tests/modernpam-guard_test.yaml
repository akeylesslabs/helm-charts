suite: akeyless-gateway Modern PAM guard
templates:
  - templates/modernpam-guard.yaml
release:
  name: gw
  namespace: ns
set:
  globalConfig.gatewayAuth.gatewayAccessId: p-xxxxxxxxxxxx
  globalConfig.gatewayAuth.gatewayAccessType: azure_ad
tests:
  - it: refuses the old and the new bastion in one release
    set:
      sra.enabled: true
      modernPam.enabled: true
      modernPam.gateway.url: http://gw-akeyless-gateway.ns.svc.cluster.local:8000/api/v2
      modernPam.broker.accessId: p-yyyyyyyyyyyy
      modernPam.broker.existingSecret: broker
    asserts:
      - failedTemplate:
          errorPattern: sra.enabled and modernPam.enabled are both true

  - it: renders nothing and does not refuse when only Modern PAM is on
    set:
      modernPam.enabled: true
      modernPam.gateway.url: http://gw-akeyless-gateway.ns.svc.cluster.local:8000/api/v2
      modernPam.broker.accessId: p-yyyyyyyyyyyy
      modernPam.broker.existingSecret: broker
    asserts:
      - notFailedTemplate: {}
