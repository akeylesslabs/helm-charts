suite: akeyless-gateway anthropic workload identity token
templates:
  - templates/deployment.yaml
set:
  globalConfig.gatewayAuth.gatewayAccessId: p-xxxxxxxxxxxx
  globalConfig.gatewayAuth.gatewayAccessType: azure_ad
tests:
  - it: disabled by default renders no anthropic token volume
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: anthropic-wif-token
          any: true

  - it: enabled mounts a projected token for the Anthropic audience
    set:
      gateway.anthropicWorkloadIdentity.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: anthropic-wif-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: https://api.anthropic.com
                    expirationSeconds: 600
                    path: token
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: anthropic-wif-token
            mountPath: /var/run/secrets/anthropic.com
            readOnly: true

  - it: custom audience and lifetime are rendered
    set:
      gateway.anthropicWorkloadIdentity.enabled: true
      gateway.anthropicWorkloadIdentity.audience: https://example.test
      gateway.anthropicWorkloadIdentity.expirationSeconds: 900
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: anthropic-wif-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: https://example.test
                    expirationSeconds: 900
                    path: token

  - it: works beside a read-only root filesystem and extra volumes
    set:
      gateway.anthropicWorkloadIdentity.enabled: true
      gateway.deployment.readOnlyRootFilesystem: true
      gateway.deployment.extraVolumes:
        - name: extra
          emptyDir: {}
      gateway.deployment.extraVolumeMounts:
        - name: extra
          mountPath: /extra
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: anthropic-wif-token
            mountPath: /var/run/secrets/anthropic.com
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra
            emptyDir: {}

  - it: rejects a lifetime below the Kubernetes minimum
    set:
      gateway.anthropicWorkloadIdentity.enabled: true
      gateway.anthropicWorkloadIdentity.expirationSeconds: 300
    asserts:
      - failedTemplate: {}
