suite: akeyless-gateway SRA custom CA
templates:
  - templates/akeyless-secure-remote-access/deployment.yaml
  - templates/akeyless-secure-remote-access/ssh-deployment.yaml
set:
  sra.enabled: true
  sra.sshConfig.CAPublicKey: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7 test
tests:
  - it: mounts nothing when sra.customCA is off, even with a source set
    set:
      globalConfig.TLSConf.tlsExistingSecret: gw-tls
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: ca-certificates
            configMap:
              name: corp-ca
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca-certificates
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
      - notExists:
          path: spec.template.spec.initContainers

  - it: extends the image trust store by default
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca-certificates
            configMap:
              name: corp-ca
      - contains:
          path: spec.template.spec.volumes
          content:
            name: etc-ssl-certs
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: usr-local-ca-certificates
            emptyDir: {}
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: custom-ca-trust
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: akeyless/zero-trust-bastion:3.7.0
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: ca-certificates
            mountPath: /custom-ca
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: etc-ssl-certs
            mountPath: /etc/ssl/certs
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: usr-local-ca-certificates
            mountPath: /usr/local/share/ca-certificates
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca-certificates
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt

  - it: copies the image trust store and appends the bundle in the init container
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: cp -RP /etc/ssl/certs/\. /trust/etc-ssl-certs/
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: cp -RP /usr/local/share/ca-certificates/\. /trust/usr-local-ca-certificates/
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: cp /custom-ca/ca-certificates\.crt /trust/usr-local-ca-certificates/custom-ca\.crt
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: cat /custom-ca/ca-certificates\.crt >> /trust/etc-ssl-certs/ca-certificates\.crt

  - it: runs the web init container with the web container security context
    template: templates/akeyless-secure-remote-access/deployment.yaml
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

  - it: runs the SSH init container without the SSH container's privileges
    template: templates/akeyless-secure-remote-access/ssh-deployment.yaml
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  - it: uses the configured SRA image for the init container
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeSourceName: corp-ca
      sra.image.repository: registry.example.com/zero-trust-bastion
      sra.image.tag: 9.9.9
      sra.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example.com/zero-trust-bastion:9.9.9
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/zero-trust-bastion:9.9.9

  - it: mounts a configMap bundle over the system trust file in replace mode
    set:
      sra.customCA.enabled: true
      sra.customCA.mode: replace
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca-certificates
            configMap:
              name: corp-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca-certificates
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
      - notExists:
          path: spec.template.spec.initContainers
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: etc-ssl-certs
            emptyDir: {}

  - it: mounts a secret bundle when the volume type is secret
    set:
      sra.customCA.enabled: true
      sra.customCA.mode: replace
      sra.customCA.volumeType: secret
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca-certificates
            secret:
              secretName: corp-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca-certificates
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt

  - it: reads the volume type case-insensitively
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeType: Secret
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca-certificates
            secret:
              secretName: corp-ca

  - it: uses the configured volume name for the volume and the mounts
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeName: corp-trust
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: corp-trust
            configMap:
              name: corp-ca
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: corp-trust
            mountPath: /custom-ca
            readOnly: true

  - it: uses the configured volume name for the replace mount
    set:
      sra.customCA.enabled: true
      sra.customCA.mode: replace
      sra.customCA.volumeName: corp-trust
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: corp-trust
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt

  - it: renders names that look like booleans as strings
    set:
      sra.customCA.enabled: true
      sra.customCA.mode: replace
      sra.customCA.volumeName: "true"
      sra.customCA.volumeSourceName: "true"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: "true"
            configMap:
              name: "true"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: "true"
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt

  - it: fails when enabled without a source name
    set:
      sra.customCA.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: sra.customCA.volumeSourceName is required when sra.customCA.enabled is true
        template: templates/akeyless-secure-remote-access/ssh-deployment.yaml

  - it: fails on an unknown volume type
    set:
      sra.customCA.enabled: true
      sra.customCA.volumeType: bogus
      sra.customCA.volumeSourceName: corp-ca
    asserts:
      - failedTemplate:
          errorMessage: sra.customCA.volumeType must be either 'configmap' or 'secret', got bogus
        template: templates/akeyless-secure-remote-access/ssh-deployment.yaml

  - it: leaves SRA alone when only gateway.customCA is on
    set:
      globalConfig.TLSConf.tlsExistingSecret: gw-tls
      gateway.customCA.enabled: true
      gateway.customCA.volumeSourceName: gw-ca
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: ca-certificates
            configMap:
              name: gw-ca
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca-certificates
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
      - notExists:
          path: spec.template.spec.initContainers
