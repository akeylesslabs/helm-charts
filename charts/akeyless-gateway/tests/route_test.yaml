suite: akeyless-gateway route
templates:
  - templates/route.yaml
tests:
  - it: renders no Route when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one Route per rule when enabled
    set:
      gateway.route.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: apiVersion
          value: route.openshift.io/v1
      - equal:
          path: kind
          value: Route
      - equal:
          path: metadata.name
          value: RELEASE-NAME-akeyless-gateway-gateway
      - equal:
          path: spec.to.name
          value: RELEASE-NAME-akeyless-gateway
      - equal:
          path: spec.port.targetPort
          value: gateway
      - notExists:
          path: spec.host
      - notExists:
          path: spec.tls

  - it: keeps a clean name when no hostname or custom path is set
    set:
      gateway.route.enabled: true
      gateway.route.rules:
        - servicePort: gateway
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-akeyless-gateway-gateway

  - it: sets host when hostname is provided
    set:
      gateway.route.enabled: true
      gateway.route.rules:
        - servicePort: gateway
          hostname: gw.example.com
    asserts:
      - equal:
          path: spec.host
          value: gw.example.com

  - it: renders a tls stanza when tls.enabled is true
    set:
      gateway.route.enabled: true
      gateway.route.tls.enabled: true
      gateway.route.tls.termination: edge
      gateway.route.tls.insecureEdgeTerminationPolicy: Redirect
    asserts:
      - equal:
          path: spec.tls.termination
          value: edge
      - equal:
          path: spec.tls.insecureEdgeTerminationPolicy
          value: Redirect

  - it: keeps distinct Route names when fullname is at the 63-char limit
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      gateway.route.enabled: true
      gateway.route.rules:
        - servicePort: gateway
        - servicePort: hvp
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-gateway
      - documentIndex: 1
        equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-hvp

  - it: renders distinct Route names for same servicePort with different hosts
    set:
      gateway.route.enabled: true
      gateway.route.rules:
        - servicePort: gateway
          hostname: gw-a.example.com
        - servicePort: gateway
          hostname: gw-b.example.com
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-akeyless-gateway-gateway-gw-a-example-com
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-akeyless-gateway-gateway-gw-b-example-com
