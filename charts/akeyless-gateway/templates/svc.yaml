---
{{- /*
Resolve the Service type ONCE, before it is used.

It was previously decided inside the `if`, in two branches — the ingress-enabled
one defaulting to NodePort and the other `required`. Both new fields below have
to test the type, and reading `.Values.gateway.service.type` directly would read
the WRONG value on the ingress branch, where an unset type resolves to NodePort
via the default rather than staying empty. Resolving here keeps one answer for
`type:`, for the loadBalancerIP condition, and for the externalTrafficPolicy
guard, so the three cannot disagree.

Rendering is unchanged: with ingress enabled an unset type still yields NodePort,
and with it disabled an unset type still fails the same `required`.
*/ -}}
{{- $svcType := .Values.gateway.service.type }}
{{- if .Values.gateway.ingress.enabled }}
{{- $svcType = default "NodePort" $svcType }}
{{- else }}
{{- $svcType = required "A valid .Values.gateway.service.type entry required!" $svcType }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "akeyless-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "akeyless-gateway.labels" . | nindent 4 }}
  {{- if .Values.gateway.service.labels }}
    {{- toYaml .Values.gateway.service.labels | nindent 4 }}
  {{- end }}
  annotations:
  {{- toYaml .Values.gateway.service.annotations | nindent 4 }}
spec:
  type: {{ $svcType }}
  {{- if eq $svcType "LoadBalancer" }}
  {{- with .Values.gateway.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.gateway.service.externalTrafficPolicy }}
  {{- if not (has $svcType (list "LoadBalancer" "NodePort")) }}
  {{- fail (printf "gateway.service.externalTrafficPolicy is set to '%s' but the resolved gateway Service type is '%s'; externalTrafficPolicy is only valid for LoadBalancer or NodePort" . $svcType) }}
  {{- end }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: gateway
      protocol: TCP
      name: gateway
  {{- if .Values.gateway.service.kmip.enabled }}
    - port: 5696
      targetPort: kmip
      protocol: TCP
      name: kmip
  {{- end }}
  {{- if .Values.gateway.service.hvp.enabled }}
    - port: 8200
      targetPort: hvp
      protocol: TCP
      name: hvp
  {{- end }}

  selector:
    {{- include "akeyless-gateway.selectorLabels" . | nindent 4 }}
{{- if .Values.sra.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "akeyless-gateway.fullname" . }}-internal"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "akeyless-gateway.labels" . | nindent 4 }}
  {{- /*
  ClusterIP, deliberately not configurable. loadBalancerIP is meaningless here
  and Kubernetes SILENTLY IGNORES externalTrafficPolicy on a ClusterIP Service
  rather than rejecting it, so exposing either would be a knob that reads as
  applied and does nothing.
  */}}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: internal-gw-api
      protocol: TCP
      name: internal-gw-api

  selector:
    {{- include "akeyless-gateway.selectorLabels" . | nindent 4 }}
{{- end }}
