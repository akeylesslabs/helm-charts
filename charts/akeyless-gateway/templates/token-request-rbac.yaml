{{/* Lets the Gateway's own service account request tokens for itself (Claude target, Token Source = Kubernetes). Only for a dedicated service account: on "default" every pod in the namespace would get the same Anthropic identity. */}}
{{- $sa := include "akeyless-gateway.getServiceAccountName" . }}
{{- $name := printf "%s-%s-token-request" .Release.Name $sa | trunc 253 | trimSuffix "-" }}
{{- if ne $sa "default" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ $sa | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
