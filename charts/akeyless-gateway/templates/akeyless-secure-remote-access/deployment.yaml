{{- if .Values.sra.enabled }}
{{- include "akeyless-gateway.validateNoPlaintextSecrets" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akeyless-sra-ssh.webNamePrefix" . }}-{{ include "akeyless-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "akeyless-sra-web.labels" . | nindent 4 }}
  {{- if .Values.sra.webConfig.deployment.labels }}
    {{- toYaml .Values.sra.webConfig.deployment.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.sra.webConfig.deployment.annotations }}
  annotations:
  {{- toYaml .Values.sra.webConfig.deployment.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.sra.webConfig.hpa.enabled }}
  replicas: {{ default 1 .Values.sra.webConfig.replicaCount }}
  {{- end }}
  {{- if .Values.sra.webConfig.deployment.strategy }}
  strategy:
    {{- toYaml .Values.sra.webConfig.deployment.strategy | nindent 4 }}
  {{- end }}    
  selector:
    matchLabels:
      {{- include "akeyless-sra-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.sra.webConfig.deployment.annotations }}
      annotations:
          {{- toYaml .Values.sra.webConfig.deployment.annotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "akeyless-sra-web.selectorLabels" . | nindent 8 }}
        {{- if .Values.sra.webConfig.deployment.labels }}
          {{- toYaml .Values.sra.webConfig.deployment.labels | nindent 8 }}
        {{- end }}
    spec:
      {{- include "akeyless-sra-web.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "akeyless-gateway.getServiceAccountName" . }}
      {{- if .Values.sra.webConfig.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.sra.webConfig.deployment.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.sra.webConfig.deployment.tolerations }}
      tolerations:
        {{- toYaml .Values.sra.webConfig.deployment.tolerations | nindent 8 }}
      {{- end }}
      {{- if and .Values.sra.webConfig.deployment.affinity .Values.sra.webConfig.deployment.affinity.enabled }}
      affinity:
        {{- toYaml .Values.sra.webConfig.deployment.affinity.data | nindent 8 }}
      {{- end }}
      {{- if .Values.sra.webConfig.deployment.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.sra.webConfig.deployment.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      volumes:
        {{- range .Values.sra.webConfig.persistence.volumes }}
        - name: {{ .name | title | lower }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-%s" $.Release.Name .name | title | lower }}
        {{- end }}
        {{- if .Values.globalConfig.TLSConf.tlsExistingSecret }}
        - name: gw-signed-ca
          secret:
            secretName: {{ .Values.globalConfig.TLSConf.tlsExistingSecret }}
            items:
              - key: {{ (.Values.globalConfig.TLSConf).tlsCertificateSecretKeyName | default "tlsCertificate" }}
                path: gw-cert.pem
        {{- end }}
        {{- if (eq "true" (include "akeyless-gateway.clusterCache.enableTls" . )) }}
        {{ include "akeyless-gateway.clusterCache.tlsVolume" . | nindent 8}}
        {{- end }}
        {{- if .Values.sra.customCA.enabled }}
        {{- include "akeyless-gateway.customCA.sourceVolume" (dict "ca" .Values.sra.customCA "key" "sra.customCA") | nindent 8 }}
        {{- end }}
        {{- if include "akeyless-gateway.customCA.extend" .Values.sra.customCA }}
        {{- include "akeyless-gateway.customCA.trustVolumes" . | nindent 8 }}
        {{- end }}
      {{- include "akeyless-sra.imagePullSecrets" . | indent 2 }}
      {{- if include "akeyless-gateway.customCA.extend" .Values.sra.customCA }}
      initContainers:
        {{- include "akeyless-gateway.customCA.initContainer" (dict "ca" .Values.sra.customCA "resources" (include "akeyless-gateway.customCA.initResources" (dict "ca" .Values.sra.customCA "resources" .Values.sra.webConfig.resources "strict" .Values.strictSecurityPolicy) | fromYaml) "image" (include "akeyless-sra.image" .) "pullPolicy" .Values.sra.image.pullPolicy "securityContext" (include "akeyless-sra-web.containerSecurityContext" .)) | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway-sra-web
          image: "{{ include "akeyless-sra.image" . }}"
          imagePullPolicy: {{ .Values.sra.image.pullPolicy }}
          {{- include "akeyless-sra-web.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: 8888
              name: web
          env:
            {{- if .Values.cacheHA.enabled }}
            - name: REDIS_SENTINEL_ADDR
              value: {{ include "akeyless-gateway.clusterCache.sentinelAddress" . }}
            - name: REDIS_SENTINEL_MASTER_NAME
              value: {{ .Values.cacheHA.redis.masterGroupName | quote }}
            {{- end }}
            {{ include "akeyless-gateway.akeylessGatewayAuthConfig" . | nindent 10 }}
            {{ include "akeyless-gateway.unifiedGatewaySraWebConfig" . | nindent 10 }}
            {{ include "akeyless-gateway.ClusterName" . | nindent 10 }}
            {{- if eq "true" (include "akeyless-gateway.clusterCache.enabled" . ) }}
            {{- include "akeyless-gateway.clusterCacheConfig" . | nindent 10 }}
            {{- end }}
            {{- if .Values.globalConfig.authorizedAccessIDs }}
            - name: GATEWAY_AUTHORIZED_ACCESS_ID
              value: {{ .Values.globalConfig.authorizedAccessIDs | quote }}
            {{- end }}
            - name: REMOTE_ACCESS_TYPE
              value: "web"
            {{- if .Values.globalConfig.gatewayAuth.azureObjectID }}
            - name: AZURE_OBJECT_ID
              value: {{ .Values.globalConfig.gatewayAuth.azureObjectID }}
            {{- end }}
            {{- if .Values.globalConfig.gatewayAuth.gcpAudience }}
            - name: GCP_AUDIENCE
              value: {{ .Values.globalConfig.gatewayAuth.gcpAudience }}
            {{- end }}
            {{-  include "httpProxySettings" . | nindent 10 }}
            {{ include "akeyless-gateway.chartMetadata" . | nindent 10 }}
            {{- if .Values.debug }}
            - name: DEBUG
              value: {{ .Values.debug | quote }}
            {{- end }}
            {{- if .Values.globalConfig.env }}
            {{- toYaml .Values.globalConfig.env | nindent 12 }}
            {{- end }}
            {{- if .Values.sra.env }}
            {{- toYaml .Values.sra.env | nindent 12 }}
            {{- end }}
          resources:
            {{- include "akeyless-gateway.containerResources" (dict "resources" .Values.sra.webConfig.resources "strict" $.Values.strictSecurityPolicy) | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8888
            {{- toYaml .Values.sra.webConfig.livenessProbe | trim | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8888
            {{- toYaml .Values.sra.webConfig.readinessProbe | trim | nindent 12 }}
          volumeMounts:
            {{- range .Values.sra.webConfig.persistence.volumes }}
            - name: {{ .name | title | lower }}
              mountPath: /home/akeyless/recordings
              subPath: recordings
            {{- end }}
            {{- if .Values.globalConfig.TLSConf.tlsExistingSecret }}
            - name: gw-signed-ca
              mountPath: "/etc/ssl/certs/gw-cert.pem"
              subPath: gw-cert.pem
            {{- end }}
            {{- if (eq "true" (include "akeyless-gateway.clusterCache.enableTls" . )) }}
            {{ include "akeyless-gateway.clusterCache.tlsVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if include "akeyless-gateway.customCA.extend" .Values.sra.customCA }}
            {{- include "akeyless-gateway.customCA.trustVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if include "akeyless-gateway.customCA.replace" .Values.sra.customCA }}
            {{- include "akeyless-gateway.customCA.replaceMount" .Values.sra.customCA | nindent 12 }}
            {{- end }}
{{- end }}
