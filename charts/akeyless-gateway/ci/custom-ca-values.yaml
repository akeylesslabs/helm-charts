globalConfig:
  gatewayAuth:
    gatewayAccessType: access_key
    gatewayCredentialsExistingSecret: akeyless-auth

gateway:
  service:
    type: ClusterIP
  deployment:
    readOnlyRootFilesystem: true
  customCA:
    enabled: true
    volumeSourceName: custom-ca

sra:
  sshConfig:
    service:
      type: ClusterIP
