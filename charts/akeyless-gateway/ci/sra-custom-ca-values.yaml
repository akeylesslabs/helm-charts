globalConfig:
  gatewayAuth:
    gatewayAccessType: access_key
    gatewayCredentialsExistingSecret: akeyless-auth

gateway:
  service:
    type: ClusterIP

sra:
  enabled: true
  customCA:
    enabled: true
    volumeSourceName: sra-custom-ca
  webConfig:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  sshConfig:
    CAPublicKey: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7 test
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    service:
      type: ClusterIP

extraObjects:
