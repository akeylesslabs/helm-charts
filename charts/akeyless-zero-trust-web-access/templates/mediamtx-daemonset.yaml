{{- $shared := "" -}}
{{- if and .Values.persistence .Values.persistence.shareStorageVolume -}}
  {{- $shared = .Values.persistence.shareStorageVolume.name | title | lower -}}
{{- end -}}
{{- $record := false -}}
{{- if and .Values.sessionRecording (hasKey .Values.sessionRecording "enabled") -}}
  {{- $record = .Values.sessionRecording.enabled -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ printf "%s-mediamtx" .Release.Name }}
  labels:
    app: mediamtx
spec:
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
      annotations:
        # MediaMTX reads its config once at start up.
        checksum/config: {{ include (print $.Template.BasePath "/mediamtx-configmap.yaml") . | sha256sum }}
    spec:
      # Pod network on purpose. On host network the worker's ICE traffic to the
      # node address is translated on the way in, the DTLS replies never find
      # the pod, and the handshake times out with everything looking correct.
      containers:
        - name: mediamtx
          image: "{{ .Values.mediamtx.image.repository }}:{{ .Values.mediamtx.image.tag }}"
          imagePullPolicy: {{ .Values.mediamtx.image.pullPolicy }}
          env:
            # So the advertised candidate is one a worker pod here can route to.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Counter-intuitive: MediaMTX emits this REVERSED, so the last
            # entry is offered first. The publisher uses only that one, so the
            # node address goes last. additionalHosts follow it, which suits a
            # browser because it does real ICE and tries them all. Reverse the
            # two and the publish dies on a DTLS timeout.
            - name: MTX_WEBRTCADDITIONALHOSTS
              value: "{{ if .Values.mediamtx.additionalHosts }}{{ join "," .Values.mediamtx.additionalHosts }},{{ end }}$(NODE_IP)"
          ports:
            # No host port: both callers reach this through the Service.
            - name: whip
              containerPort: {{ .Values.mediamtx.webrtcPort }}
              protocol: TCP
            # The media path, which the browser reaches on the node and the
            # publisher's node candidate names. Without the host port the
            # publish fails with a refusal that reads like a codec error.
            - name: ice
              containerPort: {{ .Values.mediamtx.iceUDPPort }}
              hostPort: {{ .Values.mediamtx.iceUDPPort }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
{{- if and $shared $record }}
            - name: {{ $shared }}
              mountPath: /etc/shared
{{- end }}
          resources:
{{- toYaml .Values.mediamtx.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mediamtx.webrtcPort }}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mediamtx.webrtcPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
{{- with .Values.mediamtx.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.mediamtx.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-mediamtx" .Release.Name }}
{{- if and $shared $record }}
        # Shared with the worker and the dispatcher, so ReadWriteMany: every
        # node mounts it and the uploader reads it from the dispatcher pod.
        - name: {{ $shared }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-%s" $.Release.Name .Values.persistence.shareStorageVolume.name | title | lower }}
{{- end }}
---
# internalTrafficPolicy Local keeps a worker on its own node's instance, which
# is the point of running one per node.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-mediamtx" .Release.Name }}
  labels:
    app: mediamtx
spec:
  selector:
    app: mediamtx
  internalTrafficPolicy: Local
  ports:
    - name: whip
      port: {{ .Values.mediamtx.webrtcPort }}
      targetPort: {{ .Values.mediamtx.webrtcPort }}
      protocol: TCP
    - name: ice
      port: {{ .Values.mediamtx.iceUDPPort }}
      targetPort: {{ .Values.mediamtx.iceUDPPort }}
      protocol: UDP
---
# Rolling this drops the live view for every session on the node, and now the
# recording too, since the worker keeps no file of its own.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-mediamtx" .Release.Name }}
  labels:
    app: mediamtx
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: mediamtx
