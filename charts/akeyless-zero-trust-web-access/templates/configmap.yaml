{{- include "akeyless-zero-web-access.validateValues" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-cm-akeyless
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $.Values.dispatcher.containerName }}
    chart: {{ $.Chart.Name }}
data:
{{ with .Values.config }}
  {{- if not .ztwaAuth.ztwaExistingSecret }}
  akeyless_config_file: |
    {{ required "config.gatewayURL is required" .gatewayURL }}
    cmd=auth&access-id={{ required "config.ztwaAuth.ztwaAccessID is required" .ztwaAuth.ztwaAccessID }}&access-key=
    {{- end }}
{{- end}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-cm-web-policies
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $.Values.webWorker.containerName }}
    chart: {{ $.Chart.Name }}
data:
  policies.json: |
{{ required "A valid .Values.webWorker.config.policies entry required!" .Values.webWorker.config.policies | indent 4 }}
