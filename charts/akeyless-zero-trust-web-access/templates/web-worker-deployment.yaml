apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-worker-deployment
  namespace: {{ .Release.Namespace }}
  labels:
        {{- include "akeyless-zero-web-access.labels" . | nindent 4 }}
      {{- if .Values.deployment.labels }}
        {{- toYaml .Values.deployment.labels | nindent 4 }}
      {{- end }}
spec:
  selector:
    matchLabels:
      app: web-worker
  {{- if not .Values.HPA.enabled }}
  replicas: {{ .Values.webWorker.replicaCount }}
  {{- end }}
  template:
    metadata:
      labels:
        app: web-worker
    spec:
      securityContext:
        fsGroup: 10000
        supplementalGroups: [72]
      volumes:
        - name: akeyless-conf
          emptyDir: {}
        - name: akeyless-policy-conf
          emptyDir: {}
{{- if .Values.dispatcher.config.apiGatewayCert.tlsCertsSecretName }}
        - name: gw-signed-ca
          secret:
            secretName: {{ .Values.dispatcher.config.apiGatewayCert.tlsCertsSecretName }}
            items:
              - key: tls.crt
                path: gw-cert.pem
{{- end }}
        - name: configmap-policies
          configMap:
            name: {{ $.Release.Name }}-cm-web-policies
{{- if .Values.dlp.enabled }}
        - name: configmap-conf
          {{- if $.Values.dlp.existingLogForwardSecretName }}
          secret:
            secretName: "{{ $.Values.dlp.existingLogForwardSecretName }}"
          {{- else }}
          configMap:
            name: {{ $.Release.Name }}-cm-dlp-conf
          {{- end }}
{{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: worker-config
          emptyDir:
            medium: Memory
        {{ if and .Values.persistence .Values.persistence.shareStorageVolume }}
        - name: {{ .Values.persistence.shareStorageVolume.name | title | lower }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-%s" $.Release.Name .Values.persistence.shareStorageVolume.name | title | lower }}
        {{ end }}
      initContainers:
        # Since k8s 1.9.4, config maps mount read-only volumes. Since the Docker image also writes to the config file,
        # the file must be mounted as read-write. We use init containers to copy from the config map read-only
        # path, to a read-write path
        - name: bootstrap
          image: "{{ .Values.webWorker.initContainer.image.repository }}:{{ .Values.webWorker.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.webWorker.initContainer.image.pullPolicy }}
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              set -ex
{{- if .Values.dlp.enabled }}
              [ "$(ls /configmap_conf)" ] && cp /configmap_conf/* /var/akeyless/conf
{{- end }}
              [ "$(ls /configmap_policy_conf)" ] && cp /configmap_policy_conf/* /var/akeyless/policy_conf/
              jq -e . /var/akeyless/policy_conf/policies.json || (echo "Chrome policies JSON validation failed! please correct the policies JSON structure in values.yaml" && exit 1)
          resources:
{{- toYaml .Values.webWorker.initContainer.resources | nindent 12 }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
{{- if .Values.dlp.enabled }}
            - name: configmap-conf
              mountPath: /configmap_conf
{{- end }}
            - name: akeyless-conf
              mountPath: /var/akeyless/conf
            - name: akeyless-policy-conf
              mountPath: /var/akeyless/policy_conf
            - name: configmap-policies
              mountPath: /configmap_policy_conf
{{- if .Values.dispatcher.config.apiGatewayCert.tlsCertsSecretName }}
            - name: gw-signed-ca
              mountPath: "/etc/ssl/certs/gw-cert.pem"
              subPath: gw-cert.pem
{{- end }}
{{- with include "akeyless-zero-web-access.imagePullSecrets" (dict "Root" $ "initPullSecrets" .Values.webWorker.initContainer.imagePullSecrets "imagePullSecrets" .Values.webWorker.image.imagePullSecrets) }}{{ . | nindent 6 }}{{ end }}
      terminationGracePeriodSeconds: {{ .Values.HPA.webWorker.sessionTerminationGracePeriodSeconds | default 3600 }}
      containers:
        - name: {{ .Values.webWorker.containerName }}
          image: "{{ .Values.webWorker.image.repository }}:{{ .Values.webWorker.image.tag  | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.webWorker.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 9090
              name: agent
          env:
            - name: WEB_DISPATCHER_SERVICE_DNS
              value: {{ include "akeyless-zero-web-access.fullname" . }}-disc-disp
            - name: DISPATCHER_DNS
              value: {{ include "akeyless-zero-web-access.fullname" . }}-dispatcher.{{ .Release.Namespace }}.svc
            - name: DES_DOWNLOAD_PATH
              value: /etc/shared/download
{{- if .Values.httpProxySettings.http_proxy }}
            - name: HTTP_PROXY
              value: {{ .Values.httpProxySettings.http_proxy }}
            - name: http_proxy
              value: {{ .Values.httpProxySettings.http_proxy }}
{{- end }}
{{- if .Values.httpProxySettings.https_proxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.httpProxySettings.https_proxy }}
            - name: https_proxy
              value: {{ .Values.httpProxySettings.https_proxy }}
{{- end }}
{{- if .Values.httpProxySettings.no_proxy }}
            - name: NO_PROXY
              value: {{ .Values.httpProxySettings.no_proxy }}
            - name: no_proxy
              value: {{ .Values.httpProxySettings.no_proxy }}
{{- end }}
          {{- if .Values.webWorker.config.displayWidth }}
            - name: DISPLAY_WIDTH
              value: {{ .Values.webWorker.config.displayWidth | quote }}
          {{- end }}
          {{- if .Values.webWorker.config.displayHeight }}
            - name: DISPLAY_HEIGHT
              value: {{ .Values.webWorker.config.displayHeight | quote }}
          {{- end }}
{{- /* The worker publishes its screen to the release's media server, which
     serves the live view and records. */}}
            - name: WHIP_PUBLISH_URL_BASE
              value: {{ printf "http://%s-mediamtx:%v" .Release.Name .Values.mediamtx.webrtcPort | quote }}
{{- /* Liveness-probe tunable: how long /tmp/occupied may exist without a
       viewer before the in-image probe wipes markers and recycles the
       pod. Hardcoded default in the script is 30s; override here only if
       your sessions need a longer warm-up window. */}}
{{- if and .Values.webWorker.sessionCleanup .Values.webWorker.sessionCleanup.staleGraceSeconds }}
            - name: STALE_GRACE_SECONDS
              value: {{ .Values.webWorker.sessionCleanup.staleGraceSeconds | quote }}
{{- end }}
{{- if .Values.webWorker.env }}
          {{- toYaml .Values.webWorker.env | nindent 12 }}
{{- end }}
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: worker-config
            mountPath: /config
          - name: configmap-policies
            mountPath: /etc/chromium/policies/managed
          - name: akeyless-conf
            mountPath: /var/akeyless/conf
          {{ if and .Values.persistence .Values.persistence.shareStorageVolume }}
          - name: {{ .Values.persistence.shareStorageVolume.name | title | lower }}
            mountPath: /etc/shared
          {{ end }}
{{- if .Values.dispatcher.config.apiGatewayCert.tlsCertsSecretName }}
          - name: gw-signed-ca
            mountPath: "/etc/ssl/certs/gw-cert.pem"
            subPath: gw-cert.pem
{{- end }}
          resources:
{{- toYaml .Values.webWorker.resources | nindent 12 }}
          # The probe script lives inside the image at
          # /var/akeyless/scripts/worker_liveness.sh and is version-locked to
          # web_worker_agent's clearSessionMarkers() contract. Operators tune
          # behaviour through `webWorker.sessionCleanup.staleGraceSeconds`
          # (passed via env) and the kubelet-side knobs under
          # `webWorker.livenessProbe.*` (period, threshold, etc.) — never by
          # editing the script itself.
          livenessProbe:
            exec:
              command:
                - /var/akeyless/scripts/worker_liveness.sh
{{- toYaml .Values.webWorker.livenessProbe | trim | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: agent
{{- toYaml .Values.webWorker.readinessProbe | trim | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: [ "/bin/sh", "-c", "/var/akeyless/scripts/safe_shutdown.sh" ]