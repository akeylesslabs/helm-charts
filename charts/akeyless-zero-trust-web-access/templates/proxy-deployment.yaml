{{- $replicas := .Values.webProxy.replicaCount }}
{{- if kindIs "invalid" $replicas }}
{{- if .Values.HPA.enabled }}
{{- fail "webProxy.replicaCount must be set explicitly when HPA.enabled=true: the dispatcher.replicaCount fallback does not track the HPA (the proxy has no HPA of its own)" }}
{{- end }}
{{- $replicas = .Values.dispatcher.replicaCount }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-proxy-deployment
  namespace: {{ .Release.Namespace }}
  labels:
        {{- include "akeyless-zero-web-access.labels" . | nindent 4 }}
    {{- if .Values.deployment.labels }}
      {{- toYaml .Values.deployment.labels | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: web-proxy
  replicas: {{ $replicas }}
  template:
    metadata:
      labels:
        app: web-proxy
    spec:
      securityContext:
        # Match the runtime user (nobody). The dispatcher's fsGroup 10000 is its
        # shared-upload PVC group; the proxy mounts no such volume.
        fsGroup: 65534
      volumes:
        # Shared read-write config dir. The proxy needs zero privileged creds, so the
        # dispatcher's privileged-access secret and -cm-akeyless configmap are NOT mounted.
        - name: ng-config
          emptyDir: {}
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
        - name: gw-signed-ca
          secret:
            secretName: {{ .Values.config.gatewayCert.tlsExistingSecret }}
            items:
              - key: tls.crt
                path: gw-cert.pem
{{- end }}
      initContainers:
        - name: bootstrap
          image: "{{ .Values.webProxy.initContainer.image.repository }}:{{ .Values.webProxy.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.webProxy.initContainer.image.pullPolicy }}
          command: ['sh']
          args:
            - "-c"
            - |
              set -ex
              echo "{{ required "config.gatewayURL is required" .Values.config.gatewayURL }}" > /etc/akeyless/akeyless_config_file
{{- if .Values.config.ztwaAuth.authorizedAccessIDs }}
              echo {{ range $index, $element := .Values.config.ztwaAuth.authorizedAccessIDs -}}{{- if $index -}},{{- end -}}{{ $element }}{{ end }} > /etc/akeyless/allowed_access_ids
{{- end }}
          resources:
{{- toYaml .Values.webProxy.initContainer.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: ng-config
              mountPath: /etc/akeyless
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
            - name: gw-signed-ca
              mountPath: "/etc/ssl/certs/gw-cert.pem"
              subPath: gw-cert.pem
{{- end }}
{{- with include "akeyless-zero-web-access.imagePullSecrets" (dict "Root" $ "initPullSecrets" .Values.webProxy.initContainer.imagePullSecrets "imagePullSecrets" .Values.webProxy.image.imagePullSecrets) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: {{ .Values.webProxy.containerName }}
          image: "{{ .Values.webProxy.image.repository }}:{{ .Values.webProxy.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.webProxy.image.pullPolicy }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 19414
              name: proxy
          env:
{{- if .Values.httpProxySettings.http_proxy }}
            - name: HTTP_PROXY
              value: {{ .Values.httpProxySettings.http_proxy }}
            - name: http_proxy
              value: {{ .Values.httpProxySettings.http_proxy }}
{{- end }}
{{- if .Values.httpProxySettings.https_proxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.httpProxySettings.https_proxy }}
            - name: https_proxy
              value: {{ .Values.httpProxySettings.https_proxy }}
{{- end }}
{{- if .Values.httpProxySettings.no_proxy }}
            - name: NO_PROXY
              value: {{ .Values.httpProxySettings.no_proxy }}
            - name: no_proxy
              value: {{ .Values.httpProxySettings.no_proxy }}
{{- end }}
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
            - name: AKEYLESS_CA_BUNDLE
              value: "/etc/ssl/certs/gw-cert.pem"
{{- end }}
{{- if .Values.webProxy.env }}
          {{- toYaml .Values.webProxy.env | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: ng-config
              mountPath: /etc/akeyless
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
            - name: gw-signed-ca
              mountPath: "/etc/ssl/certs/gw-cert.pem"
              subPath: gw-cert.pem
{{- end }}
          resources:
{{- toYaml .Values.webProxy.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 19414
{{- toYaml .Values.webProxy.livenessProbe | trim | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 19414
{{- toYaml .Values.webProxy.readinessProbe | trim | nindent 12 }}
