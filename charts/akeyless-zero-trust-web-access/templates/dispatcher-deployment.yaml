apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dispatcher-deployment
  namespace: {{ .Release.Namespace }}
  labels:
        {{- include "akeyless-zero-web-access.labels" . | nindent 4 }}
    {{- if .Values.deployment.labels }}
      {{- toYaml .Values.deployment.labels | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: dispatcher
  {{- if gt (int .Values.dispatcher.replicaCount) 1 }}
  {{- fail "dispatcher.replicaCount must be 1: one dispatcher per worker pool is the supported layout" }}
  {{- end }}
  replicas: {{ .Values.dispatcher.replicaCount }}
  template:
    metadata:
      labels:
        app: dispatcher
        app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.metrics.podAnnotation }}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path:   '/metrics'
        prometheus.io/port:   '2000'
  {{- end }}
    spec:
      securityContext:
        fsGroup: 10000
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - {{ .Values.dispatcher.dispatcherDNS | default "rbi.dispatcher" | quote }}
      volumes:
        - name: akeyless-config
          emptyDir: {}
        - name: ng-config
          emptyDir: {}
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
        - name: gw-signed-ca
          secret:
            secretName: {{ .Values.config.gatewayCert.tlsExistingSecret }}
            items:
              - key: tls.crt
                path: gw-cert.pem           
{{- end }}
        - name: configmap-akeyless
          configMap:
            name: {{ $.Release.Name }}-cm-akeyless
        {{ if and .Values.persistence .Values.persistence.shareStorageVolume }}
        - name: {{ .Values.persistence.shareStorageVolume.name | title | lower }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-%s" $.Release.Name .Values.persistence.shareStorageVolume.name | title | lower }}
        {{ end }}
      initContainers:
        # Since k8s 1.9.4, config maps mount read-only volumes. Since the Docker image also writes to the config file,
        # the file must be mounted as read-write. We use init containers to copy from the config map read-only
        # path, to a read-write path
        - name: bootstrap
          image: "{{ .Values.dispatcher.initContainer.image.repository }}:{{ .Values.dispatcher.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.dispatcher.initContainer.image.pullPolicy }}
          {{- if .Values.config.ztwaAuth.ztwaExistingSecret }}
          env:
            - name: accessID
              value: {{ .Values.config.ztwaAuth.ztwaAccessID | quote }}
            - name: accessKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.ztwaAuth.ztwaExistingSecret }}
                  key: ztwa-access-key
          {{- end }}
          command: ['sh']
          args:
            - "-c"
            - |
              set -ex
{{- if .Values.config.ztwaAuth.ztwaExistingSecret }}
              echo "{{ required "config.gatewayURL is required" .Values.config.gatewayURL }}" > /etc/akeyless/akeyless_config_file
{{- /* xtrace would print the access key to the init container log. Line ends are
stripped because a key file often ends in a newline, and the dispatcher reads its auth
from the last line of the file. */}}
              set +x
              printf 'cmd=auth&access-id=%s&access-key=%s\n' "$(printf '%s' "$accessID" | tr -d '\r\n')" "$(printf '%s' "$accessKey" | tr -d '\r\n')" >> /etc/akeyless/akeyless_config_file
              set -x
{{- end }}
              [ "$(ls /configmap_akeyless)" ] && cp /configmap_akeyless/* /etc/akeyless
              echo {{ include "akeyless-zero-web-access.fullname" . }}-discovery > /etc/akeyless/service-dns
              export WEB_WORKER_SERVICE_DNS=$(cat /etc/akeyless/service-dns)
              echo {{ .Values.config.allowedInternalAuth }} > /etc/akeyless/allowed_internal_auth
              echo {{ .Values.config.disableSecureCookie }} > /etc/akeyless/disable_secure_cookie
{{- if .Values.config.ztwaAuth.authorizedAccessIDs }}
              echo {{ range $index, $element := .Values.config.ztwaAuth.authorizedAccessIDs -}}{{- if $index -}},{{- end -}}{{ $element }}{{ end }} > /etc/akeyless/allowed_access_ids
{{- end }}
{{- if .Values.config.allowedBastionUrls }}
              echo {{ range $index, $element := .Values.config.allowedBastionUrls -}}{{- if $index -}},{{- end -}}{{ $element }}{{ end }} > /etc/akeyless/allowed_bastion_urls
{{- end }}
{{- if .Values.config.allowedProxyUrls }}
              echo {{ range $index, $element := .Values.config.allowedProxyUrls -}}{{- if $index -}},{{- end -}}{{ $element }}{{ end }} > /etc/akeyless/allowed_proxy_urls
{{- end }}
          resources:
{{- toYaml .Values.dispatcher.initContainer.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: configmap-akeyless
              mountPath: /configmap_akeyless
            - name: ng-config
              mountPath: /etc/akeyless
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
            - name: gw-signed-ca
              mountPath: "/etc/ssl/certs/gw-cert.pem"
              subPath: gw-cert.pem
{{- end }}
{{- with include "akeyless-zero-web-access.imagePullSecrets" (dict "Root" $ "initPullSecrets" .Values.dispatcher.initContainer.imagePullSecrets "imagePullSecrets" .Values.dispatcher.image.imagePullSecrets) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: {{ .Values.dispatcher.containerName }}
          image: "{{ .Values.dispatcher.image.repository }}:{{ .Values.dispatcher.image.tag  | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dispatcher.image.pullPolicy }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 9000
              name: web
            - containerPort: 2000
              name: metrics
          env:
            - name: WEB_WORKER_SERVICE_DNS
              value: {{ include "akeyless-zero-web-access.fullname" . }}-discovery
            - name: VERSION
              value: {{ .Chart.AppVersion }}
{{- if .Values.config.clusterName }}
            - name: CLUSTER_NAME
              value: {{ .Values.config.clusterName }}
{{- end }}
{{- if has (toString .Values.config.ztwaAuth.ztwaAccessType) (list "aws_iam" "azure_ad" "gcp") }}
            - name: ADMIN_ACCESS_ID_TYPE
              value: {{ .Values.config.ztwaAuth.ztwaAccessType | quote }}
{{- end }}
{{- if .Values.httpProxySettings.http_proxy }}
            - name: HTTP_PROXY
              value: {{ .Values.httpProxySettings.http_proxy }}
            - name: http_proxy
              value: {{ .Values.httpProxySettings.http_proxy }}
{{- end }}
{{- if .Values.httpProxySettings.https_proxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.httpProxySettings.https_proxy }}
            - name: https_proxy
              value: {{ .Values.httpProxySettings.https_proxy }}
{{- end }}
{{- if .Values.httpProxySettings.no_proxy }}
            - name: NO_PROXY
              value: {{ .Values.httpProxySettings.no_proxy }}
            - name: no_proxy
              value: {{ .Values.httpProxySettings.no_proxy }}
{{- end }}
{{- $rec := .Values.recording | default dict }}
{{- $s3 := $rec.s3 | default dict }}
{{- $sse := $s3.sse | default dict }}
            - name: MEDIA_SERVER
              value: {{ printf "%s-mediamtx:%v" .Release.Name .Values.mediamtx.webrtcPort | quote }}
            - name: ENABLE_RECORDING
              value: {{ ternary "true" "false" ($rec.enabled | default false) | quote }}
            - name: ENABLE_RECORDING_UPLOAD
              value: {{ ternary "true" "false" ($s3.enabled | default false) | quote }}
            - name: RECORDING_S3_BUCKET
              value: {{ $s3.bucket | default "" | quote }}
            - name: RECORDING_S3_PREFIX
              value: {{ $s3.prefix | default "" | quote }}
            - name: RECORDING_S3_REGION
              value: {{ $s3.region | default "" | quote }}
{{- if $s3.existingSecretName }}
            - name: RECORDING_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.existingSecretName | quote }}
                  key: {{ $s3.accessKeyIdKey | default "access-key-id" | quote }}
            - name: RECORDING_S3_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.existingSecretName | quote }}
                  key: {{ $s3.secretAccessKeyKey | default "secret-access-key" | quote }}
{{- end }}
            {{- if $s3.endpoint }}
            - name: RECORDING_S3_ENDPOINT
              value: {{ $s3.endpoint | quote }}
            {{- end }}
            - name: RECORDING_COMPRESS
              value: {{ ternary "true" "false" ($s3.compress | default false) | quote }}
            {{- if $sse.type }}
            - name: RECORDING_SSE_TYPE
              value: {{ $sse.type | quote }}
            {{- end }}
            {{- if $sse.kmsKeyId }}
            - name: RECORDING_SSE_KMS_KEY_ID
              value: {{ $sse.kmsKeyId | quote }}
            {{- end }}
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
            - name: AKEYLESS_CA_BUNDLE
              value: "/etc/ssl/certs/gw-cert.pem"
{{- end }}
{{- if .Values.dispatcher.env }}
          {{- toYaml .Values.dispatcher.env | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: configmap-akeyless
              mountPath: /configmap_conf
            - name: ng-config
              mountPath: /etc/akeyless
            - name: akeyless-config
              mountPath: /var/akeyless/conf
            {{ if and .Values.persistence .Values.persistence.shareStorageVolume }}
            - name: {{ .Values.persistence.shareStorageVolume.name | title | lower }}
              mountPath: /etc/shared
            {{ end }}
{{- if .Values.config.gatewayCert.tlsExistingSecret }}
            - name: gw-signed-ca
              mountPath: "/etc/ssl/certs/gw-cert.pem"
              subPath: gw-cert.pem
{{- end }}
          resources:
{{- toYaml .Values.dispatcher.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 9000
{{- toYaml .Values.dispatcher.livenessProbe | trim | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 9000
{{- toYaml .Values.dispatcher.readinessProbe | trim | nindent 12 }}
