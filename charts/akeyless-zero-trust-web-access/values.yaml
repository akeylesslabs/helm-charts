# Default values for akeyless-zero-trust-web-access.
# Docs: https://docs.akeyless.io/docs/sra-web-access-on-k8s
#       https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config

config:
  # Akeyless API URL that the dispatcher and the web proxy use. Keep the default for the
  # Akeyless SaaS, or set the API URL of your Akeyless Gateway.
  apiGatewayURL: https://api.akeyless.io
  apiGatewayCert:
    # Existing Secret with the Gateway CA certificate in the key tls.crt.
    tlsCertsSecretName:

  # Name of this ZTWA cluster. A change to it, or to the privileged access ID, registers a
  # new bastion.
  # Docs: https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config#cluster-name
  clusterName: defaultCluster

  # Auth method that reads the secrets of the web targets. It needs "Read" and "List" on them.
  privilegedAccess:
    # Ignored when existingSecretNames.access is set.
    accessID: ""

    # Auth method type:
    #   ""                       Auto detect.
    #   access_key               API key from existingSecretNames.access.
    #   aws_iam, azure_ad, gcp   Cloud identity. Set it when the pod cannot reach the
    #                            instance metadata service (IMDS).
    # Docs: https://docs.akeyless.io/docs/auth-with-api-key
    #       https://docs.akeyless.io/docs/auth-with-aws
    #       https://docs.akeyless.io/docs/auth-with-azure
    #       https://docs.akeyless.io/docs/auth-with-gcp
    accessType: ""

    existingSecretNames:
      # Existing Secret with the keys accessID and accessKey. Required for access_key. Not
      # allowed with a cloud accessType, which uses accessID.
      #   kubectl create secret generic ztwa-privileged-access \
      #     --from-literal=accessID=<access-id> --from-file=accessKey=./access-key
      access:
      # Existing Secret with a comma separated list of access IDs, in place of
      # privilegedAccess.authorizedAccessIDs. The key name stays allowedAccessIDs, so Secrets
      # from chart 3.x keep working.
      #   kubectl create secret generic ztwa-authorized-ids \
      #     --from-literal=allowedAccessIDs=<access-id>,<access-id>
      authorizedAccessIDs:

    # Required. Access IDs of the users that can open sessions, for example your SAML auth
    # method. The users also need "List" on the secrets of the web targets.
    authorizedAccessIDs: []
    # - p-1234

  # External URLs of the dispatcher: its Service on port 9000, or its ingress host. The
  # Portal redirects users only to these URLs. With a LoadBalancer, set it after the first
  # install and upgrade.
  # Docs: https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config#redirect-to-bastion-urls
  allowedBastionUrls: []
  # - "https://ztwa.my.org:9000"

  # External URLs of the web proxy Service on port 19414, for proxy mode sessions. This is
  # not httpProxySettings, the outbound proxy of the pods.
  # Docs: https://docs.akeyless.io/docs/sra-web-access-browsing-proxy
  allowedProxyUrls: []
  # - "https://ztwa.my.org:19414"

  # When false, the dispatcher accepts only requests with preemptive JWT auth.
  allowedInternalAuth: "false"
  # When false, the browser sends the dispatcher session cookie only over HTTPS.
  disableSecureCookie: "true"

# Kubernetes settings shared by all workloads.

# Optional, replaces the generated name of the chart resources.
fullnameOverride:

image:
  # Image pull secrets for every pod, for example [{ name: my-registry }].
  imagePullSecrets: []
  # Deprecated, use imagePullSecrets. Base64 dockerconfig for the Akeyless registry.
  dockerRepositoryCreds:

deployment:
  labels: {}

# Outbound HTTP proxy of the pods.
# Docs: https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config#proxy
httpProxySettings:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

# IP families of the Services. Leave empty for the cluster default. For dual-stack, set
# ipFamilyPolicy: PreferDualStack and ipFamilies: [IPv6, IPv4]. An IPv6-only cluster needs
# NAT64/DNS64 to reach IPv4-only endpoints.
# Docs: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
ipFamilyPolicy: ""
ipFamilies: []

# Shared ReadWriteMany volume, mounted at /etc/shared. File downloads and session recording
# need it. Limit the mount permissions to 0650 (dir_mode and file_mode). Example:
# persistence:
#   shareStorageVolume:
#     name: share-storage
#     storageClassName: ""
#     accessModes:
#       - ReadWriteMany
#     annotations:
#       volume.beta.kubernetes.io/storage-class: ""
#     size: 2Gi
#     matchLabels:
#       usage: fileshare-pv
persistence: {}

dispatcher:
  replicaCount: 1
  initContainer:
    image:
      repository: busybox
      tag: 1.30.1
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  image:
    repository: akeyless/zero-trust-web-dispatcher
    pullPolicy: Always
#    tag: latest
    imagePullSecrets: []

  containerName: "web-dispatcher"

  # Host name the dispatcher serves inside its pod. Keep the default.
  dispatcherDNS: rbi.dispatcher

  # Docs: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    enabled: false
    annotations: {}
    # Example for NGINX ingress:
    #   kubernetes.io/ingress.class: nginx
    #   kubernetes.io/proxy-connect-timeout: "4000"
    #   nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    #   nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    labels: {}
    hostname: aztwa.local
    path: /
    # TLS with the Secret <hostname>-tls, or with existingSecret.
    tls: false
    # Adds the cert-manager annotations.
    certManager: false
    # existingSecret: name-of-existing-secret

  service:
    annotations: {}
    labels: {}
    # LoadBalancer, NodePort or ClusterIP. With ingress.enabled the chart uses NodePort.
    # Docs: https://kubernetes.io/docs/concepts/services-networking/service/
    type: LoadBalancer
    port: 9000

  # Set resources: {} to clear the defaults.
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      memory: 2Gi

  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  env: []

webWorker:
  replicaCount: 5
  initContainer:
    image:
      repository: apteno/alpine-jq
      tag: 2021-04-04
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  image:
    repository: akeyless/zero-trust-web-worker
    pullPolicy: Always
#    tag: latest
    imagePullSecrets: []

  containerName: "web-worker"

  service:
    annotations: {}
    labels: {}

  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      memory: 2Gi
  # Heavy browsing profile:
  # resources:
  #   requests:
  #     cpu: 2000m
  #     memory: 3Gi
  #   limits:
  #     memory: 4Gi

  sessionCleanup:
    # Seconds a session may take to start before the liveness probe can restart a worker
    # with no viewer. Raise it if your sessions need more than 30 seconds to start.
    staleGraceSeconds: 30

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
    successThreshold: 1

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 6
    timeoutSeconds: 3
    successThreshold: 1

  # Time a worker pod gets to finish its live session before Kubernetes stops it, for
  # example on an HPA scale down or an upgrade.
  terminationGracePeriodSeconds: 3600

  env: []

  config:
    displayWidth: 2560
    displayHeight: 1200

    # Chromium managed policies, as Chrome Enterprise JSON.
    # Docs: https://chromeenterprise.google/policies/
    policies: |
        {
          "DeveloperToolsAvailability": 1,
          "PasswordManagerEnabled": false,
          "IncognitoModeAvailability": 1,
          "BrowserSignin": 0,
          "SyncDisabled": true,
          "HttpsOnlyMode": "force_enabled",
          "HttpAllowlist": ["localhost", "127.0.0.1"],
          "LoopbackNetworkAllowedForUrls": [
            "http://localhost:12411",
            "http://127.0.0.1:12411"
          ],
          "ProxySettings": {
            "ProxyMode": "direct"
          },
          "SavingBrowserHistoryDisabled": true,
          "SearchSuggestEnabled": false,
          "SSLErrorOverrideAllowed": false,
          "DisableSafeBrowsingProceedAnyway": true,
          "UserFeedbackAllowed": false,
          "AutofillAddressEnabled": false,
          "AutofillCreditCardEnabled": false,
          "TranslateEnabled": false,
          "SpellCheckServiceEnabled": false,
          "MetricsReportingEnabled": false,
          "PromotionalTabsEnabled": false,
          "BookmarkBarEnabled": false,
          "BrowserAddPersonEnabled": false,
          "BrowserGuestModeEnabled": false,
          "ImportBookmarks": false,
          "ImportHistory": false,
          "ImportSavedPasswords": false,
          "ImportAutofillFormData": false,
          "ImportHomepage": false,
          "ImportSearchEngine": false,
          "URLBlocklist": ["*"],
          "URLAllowlist": [
            "akeyless.io",
            "zerotrust.akeyless.io",
            "duosecurity.com",
            "wixpress.com",
            "googleapis.com",
            "akeyless-security.com",
            "okta.com",
            "slack.com",
            "sendgrid.com",
            "localhost",
            "127.0.0.1",
            "http://localhost:12411",
            "http://localhost:12411/*",
            "http://127.0.0.1:12411",
            "http://127.0.0.1:12411/*"
          ]
        }

# Web proxy for proxy mode sessions, with its own Service.
# Docs: https://docs.akeyless.io/docs/sra-web-access-browsing-proxy
webProxy:
  # When unset, uses dispatcher.replicaCount. Required when HPA.enabled is true.
  # replicaCount: 1
  initContainer:
    image:
      repository: busybox
      tag: 1.30.1
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  image:
    repository: akeyless/zero-trust-web-proxy
    pullPolicy: Always
#    tag: latest
    imagePullSecrets: []

  containerName: "web-proxy"

  service:
    annotations: {}
    labels: {}
    # LoadBalancer, NodePort or ClusterIP.
    # Docs: https://kubernetes.io/docs/concepts/services-networking/service/
    type: LoadBalancer
    port: 19414

  # Optional Gateway API TCPRoute for the proxy. Needs a Gateway API controller and an
  # existing Gateway with a TCP listener.
  ingress:
    enabled: false
    # Name of the existing Gateway.
    parentGateway: ""
    # Listener name, needed when the Gateway has more than one listener.
    sectionName: ""

  # Set resources: {} to clear the defaults.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi

  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # HTTP proxy by default. For a SOCKS5 proxy:
  # env:
  #   - name: WEB_PROXY_TYPE
  #     value: "SOCKS"
  env: []

# Media server for the live view, one pod per node. It also records sessions
# when recording.enabled is true.
mediamtx:
  image:
    # Recording needs an image tag with the -ffmpeg suffix.
    repository: bluenviron/mediamtx
    tag: "1.21.0-ffmpeg"
    pullPolicy: IfNotPresent
    imagePullSecrets: []

  webrtcPort: 8889

  # UDP port opened on every node. Users' browsers must be able to reach it.
  iceUDPPort: 8189

  # More addresses to offer browsers, for example a public IP when the nodes are not
  # reachable from users' networks.
  additionalHosts: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

  nodeSelector: {}
  tolerations: []

  # A media server restart ends the live view and the recording of every session on its
  # node, so an upgrade does not restart it. Delete the pod on a node with no sessions to
  # move it to the new version.
  updateStrategy:
    type: OnDelete

validator:
  # Checks the Chromium policies JSON with jq after install.
  enabled: true
  image:
    repository: apteno/alpine-jq
    pullPolicy: IfNotPresent
    tag: 2021-04-04
    imagePullSecrets: []
  # For example, with Istio set sidecar.istio.io/inject: "false" so the job can complete.
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Session recording. The media server records each session to the shared volume
# (persistence.shareStorageVolume), and the dispatcher uploads it to S3.
# Docs: https://docs.akeyless.io/docs/sra-web-access-session-recording
recording:
  # Record sessions. Upload to S3 needs s3.enabled as well.
  enabled: false

  # Upload to S3 or an S3 compatible storage.
  s3:
    enabled: false

    # Required when s3.enabled is true.
    bucket: ""
    region: ""

    # Optional prefix for the uploaded objects, for example "recordings".
    prefix: ""

    # Endpoint of an S3 compatible service, for example MinIO. Leave empty for AWS S3.
    endpoint: ""

    # Existing Secret with the S3 credentials. When empty, the dispatcher uses the AWS
    # default credential chain, for example IRSA, an instance profile, or AWS_* env vars
    # from a Secret.
    #   kubectl create secret generic ztwa-s3-credentials \
    #     --from-literal=access-key-id=<access-key-id> \
    #     --from-literal=secret-access-key=<secret-access-key>
    existingSecretName: ""
    # Keys inside that Secret.
    accessKeyIdKey: "access-key-id"
    secretAccessKeyKey: "secret-access-key"

    # Gzip the recordings before upload.
    compress: false

    # Server side encryption of the uploaded objects.
    # Docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html
    sse:
      # "" (none), "sse-s3" or "sse-kms"
      type: ""
      # KMS key ID or ARN for sse-kms. Empty uses the default KMS key.
      kmsKeyId: ""

HPA:
  # Scales the web workers. Needs metrics.enabled.
  enabled: false
  webWorker:
    busyWorkersPercentage: 50
    minReplicas: 3
    maxReplicas: 14

metrics:
  enabled: false
  podAnnotation: false
  serviceMonitor:
    # When false, Prometheus must discover the pods by annotation.
    enabled: false
#    namespace: monitoring
    interval: "15s"
#    scrapeTimeout:

    # Required with the prometheus-operator: its release label, so Prometheus finds the
    # ServiceMonitor.
#    releaseLabels:
#      release: prometheus-stack

extraObjects: []
