## Default values for akeyless-zero-trust-web-access.
## https://docs.akeyless.io/docs/sra-web-access-on-k8s
## https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config
##

config:
  ## Akeyless API URL that the dispatcher and the web proxy use.
  ## Keep the default for the Akeyless SaaS, or set the API URL of your Akeyless Gateway.
  ##
  gatewayURL: https://api.akeyless.io

  gatewayCert:
    ## Use a K8s existing secret for the Gateway CA certificate, when it is not signed by a public CA.
    ## Must include the following key: tls.crt
    ##
    tlsExistingSecret:

  ## This is the name of this ZTWA cluster. A change to it, or to ztwaAuth.ztwaAccessID, registers a new bastion.
  ## https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config#cluster-name
  ##
  clusterName: defaultCluster

  ztwaAuth:
    ## Auth method that reads the secrets of the web targets. It needs Read and List permissions on them.
    ## Supported types: access_key, cloud identity (aws_iam/azure_ad/gcp). Leave empty to auto detect.
    ## Set a cloud type when the pod cannot reach the instance metadata service (IMDS).
    ## If using access_key, you must also add ztwaExistingSecret which includes the key
    ## https://docs.akeyless.io/docs/sra-web-access-on-k8s
    ##
    ztwaAccessID: ""
    ztwaAccessType: ""
    ## Use a K8s existing secret to set the access_key type. Not allowed with a cloud type.
    ## Must include the following key: ztwa-access-key
    ##
    ztwaExistingSecret:

    ## List Access IDs that can open ZTWA sessions, for example your SAML auth method.
    ## Required: with no Access IDs the dispatcher and the web proxy accept no user.
    ## The users also need List permission on the secrets of the web targets.
    ##
    authorizedAccessIDs: []

  ## External URLs of the dispatcher: its Service on port 9000, or its ingress host.
  ## The Portal redirects users only to these URLs. With a LoadBalancer, set it after the first install and upgrade.
  ## https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config#redirect-to-bastion-urls
  ##
  allowedBastionUrls: []

  ## External URLs of the web proxy Service on port 19414, for proxy mode sessions.
  ## This is not httpProxySettings, the outbound proxy of the pods.
  ## https://docs.akeyless.io/docs/sra-web-access-browsing-proxy
  ##
  allowedProxyUrls: []

  ## When false, the dispatcher accepts only requests with preemptive JWT auth.
  ##
  allowedInternalAuth: "false"

  ## When false, the browser sends the dispatcher session cookie only over HTTPS.
  ##
  disableSecureCookie: "true"

## Optional, replaces the generated name of the chart resources.
##
fullnameOverride:

image:
  ## Image pull secrets for every pod, for example [{ name: my-registry }].
  ##
  imagePullSecrets: []

  ## Deprecated, use imagePullSecrets. Base64 dockerconfig for the Akeyless registry.
  ##
  dockerRepositoryCreds:

deployment:
  labels: {}

## Linux system HTTP Proxy, the outbound proxy of the pods
## https://docs.akeyless.io/docs/sra-web-access-on-k8s-adv-config#proxy
##
httpProxySettings:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

## IP families of the Services. Leave empty for the cluster default.
## For dual-stack, set ipFamilyPolicy: PreferDualStack and ipFamilies: [IPv6, IPv4].
## An IPv6-only cluster needs NAT64/DNS64 to reach IPv4-only endpoints.
## https://kubernetes.io/docs/concepts/services-networking/dual-stack/
##
ipFamilyPolicy: ""
ipFamilies: []

## Shared ReadWriteMany volume, mounted at /etc/shared. File downloads and session recording need it.
## Set shareStorageVolume with name, storageClassName, accessModes (ReadWriteMany) and size,
## and optionally annotations and matchLabels. Limit the mount permissions to 0650 (dir_mode and file_mode).
## https://docs.akeyless.io/docs/sra-web-access-on-k8s
##
persistence: {}

dispatcher:
  replicaCount: 1
  initContainer:
    image:
      repository: busybox
      tag: 1.30.1
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  image:
    repository: akeyless/zero-trust-web-dispatcher
    pullPolicy: Always
    # tag: latest
    imagePullSecrets: []

  containerName: "web-dispatcher"

  ## Host name the dispatcher serves inside its pod. Keep the default.
  ##
  dispatcherDNS: rbi.dispatcher

  ## https://kubernetes.io/docs/concepts/services-networking/ingress/
  ##
  ingress:
    enabled: false
    annotations: {}
    labels: {}
    hostname: aztwa.local
    path: /
    ## TLS with the secret <hostname>-tls, or with existingSecret.
    ##
    tls: false
    ## Adds the cert-manager annotations.
    ##
    certManager: false
    # existingSecret:

  service:
    annotations: {}
    labels: {}
    ## LoadBalancer, NodePort or ClusterIP. With ingress.enabled the chart uses NodePort.
    ## https://kubernetes.io/docs/concepts/services-networking/service/
    ##
    type: LoadBalancer
    port: 9000

  ## Set resources: {} to clear the defaults.
  ##
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      memory: 2Gi

  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  env: []

webWorker:
  replicaCount: 5
  initContainer:
    image:
      repository: apteno/alpine-jq
      tag: 2021-04-04
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  image:
    repository: akeyless/zero-trust-web-worker
    pullPolicy: Always
    # tag: latest
    imagePullSecrets: []

  containerName: "web-worker"

  service:
    annotations: {}
    labels: {}

  ## For heavy browsing, raise to requests cpu 2000m and memory 3Gi, and limit memory 4Gi.
  ##
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      memory: 2Gi

  sessionCleanup:
    ## Seconds a session may take to start before the liveness probe can restart a worker with no viewer.
    ## Raise it if your sessions need more than 30 seconds to start.
    ##
    staleGraceSeconds: 30

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
    successThreshold: 1

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 6
    timeoutSeconds: 3
    successThreshold: 1

  ## Time a worker pod gets to finish its live session before Kubernetes stops it,
  ## for example on an HPA scale down or an upgrade.
  ##
  terminationGracePeriodSeconds: 3600

  env: []

  config:
    displayWidth: 2560
    displayHeight: 1200

    ## Chromium managed policies, as Chrome Enterprise JSON.
    ## https://chromeenterprise.google/policies/
    ##
    policies: |
        {
          "DeveloperToolsAvailability": 1,
          "PasswordManagerEnabled": false,
          "IncognitoModeAvailability": 1,
          "BrowserSignin": 0,
          "SyncDisabled": true,
          "HttpsOnlyMode": "force_enabled",
          "HttpAllowlist": ["localhost", "127.0.0.1"],
          "LoopbackNetworkAllowedForUrls": [
            "http://localhost:12411",
            "http://127.0.0.1:12411"
          ],
          "ProxySettings": {
            "ProxyMode": "direct"
          },
          "SavingBrowserHistoryDisabled": true,
          "SearchSuggestEnabled": false,
          "SSLErrorOverrideAllowed": false,
          "DisableSafeBrowsingProceedAnyway": true,
          "UserFeedbackAllowed": false,
          "AutofillAddressEnabled": false,
          "AutofillCreditCardEnabled": false,
          "TranslateEnabled": false,
          "SpellCheckServiceEnabled": false,
          "MetricsReportingEnabled": false,
          "PromotionalTabsEnabled": false,
          "BookmarkBarEnabled": false,
          "BrowserAddPersonEnabled": false,
          "BrowserGuestModeEnabled": false,
          "ImportBookmarks": false,
          "ImportHistory": false,
          "ImportSavedPasswords": false,
          "ImportAutofillFormData": false,
          "ImportHomepage": false,
          "ImportSearchEngine": false,
          "URLBlocklist": ["*"],
          "URLAllowlist": [
            "akeyless.io",
            "zerotrust.akeyless.io",
            "duosecurity.com",
            "wixpress.com",
            "googleapis.com",
            "akeyless-security.com",
            "okta.com",
            "slack.com",
            "sendgrid.com",
            "localhost",
            "127.0.0.1",
            "http://localhost:12411",
            "http://localhost:12411/*",
            "http://127.0.0.1:12411",
            "http://127.0.0.1:12411/*"
          ]
        }

## Web proxy for proxy mode sessions, with its own Service.
## https://docs.akeyless.io/docs/sra-web-access-browsing-proxy
##
webProxy:
  ## When unset, uses dispatcher.replicaCount. Required when HPA.enabled is true.
  ##
  # replicaCount: 1
  initContainer:
    image:
      repository: busybox
      tag: 1.30.1
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  image:
    repository: akeyless/zero-trust-web-proxy
    pullPolicy: Always
    # tag: latest
    imagePullSecrets: []

  containerName: "web-proxy"

  service:
    annotations: {}
    labels: {}
    ## LoadBalancer, NodePort or ClusterIP.
    ## https://kubernetes.io/docs/concepts/services-networking/service/
    ##
    type: LoadBalancer
    port: 19414

  ## Optional Gateway API TCPRoute for the proxy.
  ## Needs a Gateway API controller and an existing Gateway with a TCP listener.
  ##
  ingress:
    enabled: false
    ## Name of the existing Gateway.
    ##
    parentGateway: ""
    ## Listener name, needed when the Gateway has more than one listener.
    ##
    sectionName: ""

  ## Set resources: {} to clear the defaults.
  ##
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi

  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 3
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  ## HTTP proxy by default. Set WEB_PROXY_TYPE to SOCKS for a SOCKS5 proxy.
  ##
  env: []

## Media server for the live view, one pod per node. It also records sessions when recording.enabled is true.
##
mediamtx:
  image:
    ## Recording needs an image tag with the -ffmpeg suffix.
    ##
    repository: bluenviron/mediamtx
    tag: "1.21.0-ffmpeg"
    pullPolicy: IfNotPresent
    imagePullSecrets: []

  webrtcPort: 8889

  ## UDP port opened on every node. Users' browsers must be able to reach it.
  ##
  iceUDPPort: 8189

  ## More addresses to offer browsers, for example a public IP when the nodes are not reachable from users' networks.
  ##
  additionalHosts: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

  nodeSelector: {}
  tolerations: []

  ## A media server restart ends the live view and the recording of every session on its node,
  ## so an upgrade does not restart it. Delete the pod on a node with no sessions to move it to the new version.
  ##
  updateStrategy:
    type: OnDelete

validator:
  ## Checks the Chromium policies JSON with jq after install.
  ##
  enabled: true
  image:
    repository: apteno/alpine-jq
    pullPolicy: IfNotPresent
    tag: 2021-04-04
    imagePullSecrets: []
  ## Pod annotations, for example sidecar.istio.io/inject: "false" so the job can complete with Istio.
  ##
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

## Session recording. The media server records each session to the shared volume
## (persistence.shareStorageVolume), and the dispatcher uploads it to S3.
## https://docs.akeyless.io/docs/sra-web-access-session-recording
##
recording:
  ## Record sessions. Upload to S3 needs s3.enabled as well.
  ##
  enabled: false

  ## Upload to S3 or an S3 compatible storage.
  ##
  s3:
    enabled: false

    ## Required when s3.enabled is true.
    ##
    bucket: ""
    region: ""

    ## Optional prefix for the uploaded objects, for example "recordings".
    ##
    prefix: ""

    ## Endpoint of an S3 compatible service, for example MinIO. Leave empty for AWS S3.
    ##
    endpoint: ""

    ## Use a K8s existing secret for the S3 credentials. Must include the keys set in accessKeyIdKey and secretAccessKeyKey.
    ## When empty, the dispatcher uses the AWS default credential chain, for example IRSA or an instance profile.
    ##
    existingSecretName: ""
    accessKeyIdKey: "access-key-id"
    secretAccessKeyKey: "secret-access-key"

    ## Gzip the recordings before upload.
    ##
    compress: false

    ## Server side encryption of the uploaded objects. type: "" (none), "sse-s3" or "sse-kms".
    ## kmsKeyId: KMS key ID or ARN for sse-kms. Empty uses the default KMS key.
    ## https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html
    ##
    sse:
      type: ""
      kmsKeyId: ""

HPA:
  ## Scales the web workers. Needs metrics.enabled.
  ##
  enabled: false
  webWorker:
    busyWorkersPercentage: 50
    minReplicas: 3
    maxReplicas: 14

metrics:
  enabled: false
  podAnnotation: false
  serviceMonitor:
    ## When false, Prometheus must discover the pods by annotation.
    ##
    enabled: false
    # namespace: monitoring
    interval: "15s"
    # scrapeTimeout:
    ## Required with the prometheus-operator: its release label, so Prometheus finds the ServiceMonitor.
    ##
    # releaseLabels:
    #   release: prometheus-stack

## Extra Kubernetes manifests rendered with the release. Each entry is rendered with tpl.
##
extraObjects: []
