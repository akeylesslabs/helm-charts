suite: privileged access and authorized access IDs
release:
  name: ztwa
  namespace: sra
set:
  config.ztwaAuth.ztwaAccessID: p-priv
  config.ztwaAuth.authorizedAccessIDs: [p-1, p-2]
tests:
  - it: "without an access Secret the auth line carries an empty access key"
    template: templates/configmap.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: data.akeyless_config_file
          value: |
            https://api.akeyless.io
            cmd=auth&access-id=p-priv&access-key=

  - it: "without an access Secret or accessID the render fails"
    template: templates/configmap.yaml
    set:
      config.ztwaAuth.ztwaAccessID: ""
    asserts:
      - failedTemplate:
          errorPattern: "config.ztwaAuth.ztwaAccessID is required"

  - it: "an access Secret replaces the auth line, the ID comes from values and the key from the Secret"
    templates:
      - templates/configmap.yaml
      - templates/dispatcher-deployment.yaml
    set:
      config.ztwaAuth.ztwaExistingSecret: priv-secret
    asserts:
      - notExists:
          path: data.akeyless_config_file
        template: templates/configmap.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: accessID
            value: p-priv
        template: templates/dispatcher-deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: accessKey
            valueFrom:
              secretKeyRef:
                name: priv-secret
                key: ztwa-access-key
        template: templates/dispatcher-deployment.yaml

  - it: "the init container turns xtrace off and strips line ends while it writes the access key"
    template: templates/dispatcher-deployment.yaml
    set:
      config.ztwaAuth.ztwaExistingSecret: priv-secret
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[1]
          pattern: "set \\+x\\nprintf 'cmd=auth&access-id=%s&access-key=%s\\\\n' \"\\$\\(printf '%s' \"\\$accessID\" \\| tr -d '\\\\r\\\\n'\\)\" \"\\$\\(printf '%s' \"\\$accessKey\" \\| tr -d '\\\\r\\\\n'\\)\" >> /etc/akeyless/akeyless_config_file\\nset -x\\n"

  - it: "access_key without an access Secret fails"
    template: templates/configmap.yaml
    set:
      config.ztwaAuth.ztwaAccessType: access_key
    asserts:
      - failedTemplate:
          errorPattern: "ztwaAccessType access_key needs config.ztwaAuth.ztwaExistingSecret, a Secret with the key ztwa-access-key"

  - it: "a cloud accessType with an access Secret fails"
    template: templates/configmap.yaml
    set:
      config.ztwaAuth.ztwaAccessType: gcp
      config.ztwaAuth.ztwaExistingSecret: priv-secret
    asserts:
      - failedTemplate:
          errorPattern: "ztwaAccessType gcp uses config.ztwaAuth.ztwaAccessID. Remove config.ztwaAuth.ztwaExistingSecret,"

  - it: "access_key with an access Secret renders no ADMIN_ACCESS_ID_TYPE"
    template: templates/dispatcher-deployment.yaml
    set:
      config.ztwaAuth.ztwaAccessType: access_key
      config.ztwaAuth.ztwaExistingSecret: priv-secret
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_ACCESS_ID_TYPE
          any: true

  - it: "auto detect renders no ADMIN_ACCESS_ID_TYPE"
    template: templates/dispatcher-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_ACCESS_ID_TYPE
          any: true

  - it: "a cloud accessType renders ADMIN_ACCESS_ID_TYPE"
    template: templates/dispatcher-deployment.yaml
    set:
      config.ztwaAuth.ztwaAccessType: azure_ad
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_ACCESS_ID_TYPE
            value: azure_ad

  - it: "the schema rejects an unknown accessType"
    template: templates/dispatcher-deployment.yaml
    set:
      config.ztwaAuth.ztwaAccessType: aws
    asserts:
      - failedTemplate:
          errorPattern: "value must be one of"

  - it: "authorizedAccessIDs reach the dispatcher and the web proxy"
    templates:
      - templates/dispatcher-deployment.yaml
      - templates/proxy-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[1]
          pattern: "echo p-1,p-2 > /etc/akeyless/allowed_access_ids"

  - it: "an access ID is required"
    template: templates/configmap.yaml
    set:
      config.ztwaAuth.ztwaAccessID: ""
      config.ztwaAuth.ztwaExistingSecret: priv-secret
    asserts:
      - failedTemplate:
          errorPattern: "config.ztwaAuth.ztwaAccessID is required"

  - it: "empty authorizedAccessIDs fails"
    template: templates/configmap.yaml
    set:
      config.ztwaAuth.authorizedAccessIDs: []
    asserts:
      - failedTemplate:
          errorPattern: "authorizedAccessIDs is empty"

  - it: "ALLOWED_ACCESS_IDS in both env lists replaces authorizedAccessIDs"
    templates:
      - templates/dispatcher-deployment.yaml
      - templates/proxy-deployment.yaml
    set:
      config.ztwaAuth.authorizedAccessIDs: []
      dispatcher.env: [{name: ALLOWED_ACCESS_IDS, value: "p-1"}]
      webProxy.env: [{name: ALLOWED_ACCESS_IDS, value: "p-1"}]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOWED_ACCESS_IDS, value: "p-1"}

  - it: "ALLOWED_ACCESS_IDS from a Secret in both env lists replaces authorizedAccessIDs"
    template: templates/proxy-deployment.yaml
    set:
      config.ztwaAuth.authorizedAccessIDs: []
      dispatcher.env: [{name: ALLOWED_ACCESS_IDS, valueFrom: {secretKeyRef: {name: ids, key: ids}}}]
      webProxy.env: [{name: ALLOWED_ACCESS_IDS, valueFrom: {secretKeyRef: {name: ids, key: ids}}}]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOWED_ACCESS_IDS, valueFrom: {secretKeyRef: {name: ids, key: ids}}}

  - it: "ALLOWED_ACCESS_IDS in one env list only fails and names the other"
    template: templates/configmap.yaml
    set:
      config.ztwaAuth.authorizedAccessIDs: []
      dispatcher.env: [{name: ALLOWED_ACCESS_IDS, value: "p-1"}]
    asserts:
      - failedTemplate:
          errorPattern: "ALLOWED_ACCESS_IDS is set in dispatcher.env but not in webProxy.env"

  - it: "the schema rejects an empty authorized access ID"
    template: templates/dispatcher-deployment.yaml
    set:
      config.ztwaAuth.authorizedAccessIDs: [""]
    asserts:
      - failedTemplate:
          errorPattern: "authorizedAccessIDs/0"

  - it: "the schema accepts a numeric authorized access ID"
    template: templates/dispatcher-deployment.yaml
    set:
      config.ztwaAuth.authorizedAccessIDs: [12345]
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[1]
          pattern: "echo 12345 > /etc/akeyless/allowed_access_ids"
