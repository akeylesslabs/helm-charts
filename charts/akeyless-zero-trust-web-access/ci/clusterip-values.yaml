fullnameOverride: ztwa-ci

config:
  ztwaAuth:
    # Test-only placeholders, not real access IDs. No key, so the dispatcher takes the
    # cloud identity path, which these smoke values never run.
    ztwaAccessID: p-12345678911123
    authorizedAccessIDs:
      - p-12345678911124

# Test-only install smoke values. The dispatcher and worker images require
# registry pull credentials and are amd64-only, so keep workloads scaled to zero
# for public chart-testing and arm64 kind compatibility.
dispatcher:
  replicaCount: 0
  service:
    type: ClusterIP

webProxy:
  # See dispatcher.replicaCount comment above.
  replicaCount: 0
  service:
    type: ClusterIP

webWorker:
  # See dispatcher.replicaCount comment above.
  replicaCount: 0

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    data:
      release: "{{ .Release.Name }}"
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    spec:
      podSelector:
        matchLabels:
          extra-objects/selects: nothing
      policyTypes:
        - Ingress
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    spec:
      type: ClusterIP
      ports:
        - name: probe
          port: {{ add 8000 (len .Release.Name) }}
          targetPort: 8080
