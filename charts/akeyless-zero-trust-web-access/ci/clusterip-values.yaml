fullnameOverride: ztwa-ci

# Test-only install smoke values. The dispatcher and worker images require
# registry pull credentials and are amd64-only, so keep workloads scaled to zero
# for public chart-testing and arm64 kind compatibility.
dispatcher:
  replicaCount: 0
  service:
    type: ClusterIP
  config:
    listOnlyCredentials:
      samlAccessID: p-12345678911123
    privilegedAccess:
      accessID: p-12345678911123
      # Test-only placeholder; not a real credential.
      accessKey: dummy-access-key

webWorker:
  # See dispatcher.replicaCount comment above.
  replicaCount: 0

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    data:
      release: "{{ .Release.Name }}"
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    spec:
      podSelector:
        matchLabels:
          extra-objects/selects: nothing
      policyTypes:
        - Ingress
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    spec:
      type: ClusterIP
      ports:
        - name: probe
          port: {{ add 8000 (len .Release.Name) }}
          targetPort: 8080
