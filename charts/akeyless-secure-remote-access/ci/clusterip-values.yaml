fullnameOverride: sra-ci

# Test-only empty docker config, base64 for {"auths":{}}; not a real credential.
dockerRepositoryCreds: eyJhdXRocyI6e319Cg==

ztbConfig:
  enabled: false
  service:
    type: ClusterIP

ztpConfig:
  enabled: false
  service:
    type: ClusterIP

sshConfig:
  enabled: false
  service:
    type: ClusterIP

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
      labels:
        extra-objects-probe: "true"
    data:
      release: "{{ .Release.Name }}"
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
      labels:
        extra-objects-probe: "true"
    spec:
      provider: akeyless
      parameters:
        release: "{{ .Release.Name }}"
