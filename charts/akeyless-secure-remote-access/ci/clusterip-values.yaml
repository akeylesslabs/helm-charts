fullnameOverride: sra-ci

# Test-only empty docker config, base64 for {"auths":{}}; not a real credential.
dockerRepositoryCreds: eyJhdXRocyI6e319Cg==

ztbConfig:
  enabled: false
  service:
    type: ClusterIP

ztpConfig:
  enabled: false
  service:
    type: ClusterIP

sshConfig:
  enabled: false
  service:
    type: ClusterIP

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    data:
      release: "{{ .Release.Name }}"
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    spec:
      provider: akeyless
      parameters:
        release: "{{ .Release.Name }}"
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: "{{ .Release.Name }}-extra"
      namespace: "{{ .Release.Namespace }}"
    spec:
      type: ClusterIP
      ports:
        - name: probe
          port: {{ add 8000 (len .Release.Name) }}
          targetPort: 8080
