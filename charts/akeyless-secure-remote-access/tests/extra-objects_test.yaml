suite: akeyless-secure-remote-access extraObjects
templates:
  - templates/extra-objects.yaml
release:
  name: rel
  namespace: extra-ns
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders every object with release context and values
    set:
      fullnameOverride: "sra-unit"
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-extra"
            namespace: "{{ .Release.Namespace }}"
          data:
            value: "{{ .Values.fullnameOverride }}"
        - apiVersion: secrets-store.csi.x-k8s.io/v1
          kind: SecretProviderClass
          metadata:
            name: "{{ .Release.Name }}-extra"
            namespace: "{{ .Release.Namespace }}"
          spec:
            provider: custom-provider
            parameters:
              configuration: custom-value
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: metadata.name
          value: rel-extra
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: extra-ns
        documentIndex: 0
      - equal:
          path: data.value
          value: "sra-unit"
        documentIndex: 0
      - isKind:
          of: SecretProviderClass
        documentIndex: 1
      - isAPIVersion:
          of: secrets-store.csi.x-k8s.io/v1
        documentIndex: 1
      - equal:
          path: metadata.name
          value: rel-extra
        documentIndex: 1
      - equal:
          path: spec.parameters.configuration
          value: custom-value
        documentIndex: 1

  - it: renders the extraObjects from the ci install values
    values:
      - ../ci/clusterip-values.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data.release
          value: rel
        documentIndex: 0
      - isKind:
          of: SecretProviderClass
        documentIndex: 1
